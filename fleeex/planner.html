<style>
/* Fleeex palette overrides: warm greys, one orange, semantic colour only for exceptions */
.phead__title h1{font-weight:500;letter-spacing:-.03em}
/* Brand buttons: white text and icons */
:root{--on-orange:#fff}
.btn--primary,.btn--primary svg{color:#fff}
/* Calm cards: flat grey surface, colour only on small marks (status icon, ETA, issue line) */
.bcard,.bcard[data-tone=plan],.bcard[data-tone=live]{background:#1c1b19;border-color:transparent}
.bcard:hover{background:#211f1d;border-color:#3a3633}
.bcard__status{background:transparent!important;padding:0!important;color:var(--text-2)!important;font-weight:500}
.bcard__status svg{color:var(--status)}
.bcard[data-tone=late]{background:#1c1b19;border-color:#e5484d4d}
.bcard[data-tone=issue]{background:transparent;border:1px dashed #e5484d59}
.bcard[data-tone=unassigned],.bcard[data-tone=draft]{background:transparent;border:1px dashed #4d4945}
.bstate--blocked{background:#1a1917;border:1px dashed #3a3633}
.badd{border-color:#2d2a27}
/* Tooltips: small and black */
.tooltip{background:#0a0908!important;color:#edeae6!important;border:1px solid #fff4ea1a;font-size:11.5px;padding:7px 10px;border-radius:9px;box-shadow:0 12px 32px #0009;max-width:260px}
.tooltip:after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:#0a0908;border-right:1px solid #fff4ea1a;border-bottom:1px solid #fff4ea1a;transform:translate(-50%) rotate(45deg)}
.tooltip--below:after{top:-5px;bottom:auto;transform:translate(-50%) rotate(225deg)}
/* Driver card: neutral rows, colour only on the status word and dot */
.doclist__row{background:#1c1b19!important}
.doclist__row b,.doclist__row .doclist__date{color:var(--text-2)}
.qcard__phone{background:#1c1b19;border:1px solid #2d2a27}
</style>
<script>
/* Main nav: Dashboard opens the home page. Works both from the repo (file://) and the published artifact. */
document.addEventListener('click',function(e){
  var el=e.target.closest('a,button'); if(!el) return;
  var t=(el.textContent||'').trim();
  if(t==='Dashboard'){e.preventDefault();e.stopPropagation();location.href=location.protocol==='file:'?'home-dashboard.html':'./';}
},true);
</script>
<script src="driver-drawer.js"></script>
<script src="trip-drawer.js"></script>
<script>
/* Driver details drawer on the Planner: built from what the board already shows. */
(function(){
  const txt=(el,sel)=>{const n=el&&el.querySelector(sel);return n?n.textContent.trim():''};
  const DOCINFO={'License':['Driving licence C+E','Needed to drive trucks with a trailer.','card'],'CQC':['CQC','Certificate of Professional Competence. Required to drive goods vehicles for work.','shield'],'Tachograph card':['Tachograph card','Records driving and rest hours.','gauge']};
  function parseDocs(tip){
    return (tip||'').split('\n').filter(Boolean).map(line=>{
      const m=line.match(/^([^:]+):\s*(\w+)\s*·\s*(.+?)\s*\((.+)\)$/);if(!m)return null;
      const [,key,state,date,rel]=m;const info=DOCINFO[key]||[key,'','card'];
      const st=/expired/i.test(state)?'expired':/expiring/i.test(state)?'expiring':'ok';
      return {label:info[0],info:info[1],icon:info[2],date,state:st,when:st==='ok'?'Valid':st==='expired'?rel.replace(/^/, 'Expired '):rel.replace(/^in /,'In ')};
    }).filter(Boolean);
  }
  function rowOf(el){let n=el;while(n&&!n.querySelector('.bcard, .badd, .bstate--blocked')&&!n.classList.contains('planner'))n=n.parentElement;return n}
  function open(info){
    const row=rowOf(info);
    const name=txt(info,'.binfo__name'), veh=txt(info,'.binfo__truck');
    const nowEl=info.querySelector('.binfo__now'), nowText=nowEl?nowEl.textContent.trim():'';
    const cls=nowEl?nowEl.className:'';
    const toneS=/late|blocked/.test(cls)?'bad':/free|off|done/.test(cls)?'muted':'live';
    const card=seen[name]||{};const phone=card.phone||'',base=card.base||'';
    const cards=row?[...row.querySelectorAll('.bcard')]:[];
    const tone=t=>({live:'live',late:'bad',issue:'bad',done:'done',unassigned:'warn',draft:'muted',cancel:'done'}[t]||'muted');
    const trips=cards.map(c=>({time:(txt(c,'.bcard__when').match(/\d{2}:\d{2}/)||['—'])[0],route:txt(c,'.bcard__route').replace(/\s*\+\d+ stops?$/,''),client:txt(c,'.bcard__client'),status:txt(c,'.bcard__status')||'Planned',tone:tone(c.dataset.tone)}));
    const live=cards.find(c=>/live|late/.test(c.dataset.tone||''));
    let now=null,alert=null;
    const blocked=row&&row.querySelector('.bstate--blocked');
    if(blocked){alert={title:'Can’t drive',text:blocked.textContent.trim().replace(/^Can’t drive\s*·?\s*/,'').replace(/\s+/g,' ')};}
    else if(live){const r=txt(live,'.bcard__route').replace(/\s*\+\d+ stops?$/,''),parts=r.split('→').map(x=>x.trim());
      now={route:r,from:parts[0],to:parts[parts.length-1],late:live.dataset.tone==='late',detail:[txt(live,'.bcard__eta')||txt(live,'.bcard__when'),txt(live,'.bcard__client')].filter(Boolean).join(' · ')};}
    else now={title:nowText||'No trip right now',detail:cards.length?'':'Nothing planned today'};
    const ini=txt(info,'.avatar')||name.split(' ').map(w=>w[0]).join('').slice(0,2);
    FxDriver.open({ini,name,vehicle:veh,phone,base,status:{text:nowText,tone:toneS},now,alert,drivenH:null,trips,
      emptyTrips:'No trips planned today.',docs:parseDocs((info.querySelector('.dchips')||{}).dataset?.tip)});
  }
  /* The board's hover card holds phone and depot; remember it while it is visible (it closes on press). */
  const seen={};
  const grab=()=>{const q=document.querySelector('.qcard');if(!q)return;const n=txt(q,'.qcard__head b');if(n)seen[n]={phone:txt(q,'.qcard__phone'),base:txt(q,'.qcard__head div span')}};
  new MutationObserver(grab).observe(document.body,{childList:true,subtree:true});
  document.addEventListener('pointerdown',grab,true);
  document.addEventListener('click',e=>{
    const hit=e.target.closest('.binfo__head, .binfo__now');
    if(!hit)return;const info=hit.closest('.binfo');if(!info)return;
    e.preventDefault();e.stopPropagation();open(info);
  },true);
  const st=document.createElement('style');st.textContent='.binfo__head{cursor:pointer;border-radius:10px}.binfo__head:hover .binfo__name{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#8a847e}';document.head.appendChild(st);
})();
</script>
<script>
/* Trip drawers on the Planner (same component as the Dashboard). Built from what the board shows. */
(function(){
  const txt=(el,sel)=>{const n=el&&el.querySelector(sel);return n?n.textContent.trim():''};
  const dateLabel=()=>{const t=txt(document,'.datenav__picker span')||'Mon 28 Sep';const d=new Date(t);return isNaN(d)?t:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','').replace('Sept','Sep')};
  const TONE={live:'transit',late:'delayed',plan:'assigned',done:'completed',unassigned:'unassigned',draft:'unassigned',issue:'assigned',cancel:'completed'};
  function rows(){return [...document.querySelectorAll('.binfo')].map(b=>{const nowEl=b.querySelector('.binfo__now');const cls=nowEl?nowEl.className:'';const name=txt(b,'.binfo__name');return {id:name,ini:txt(b,'.avatar')||name.split(' ').map(w=>w[0]).join(''),name,veh:txt(b,'.binfo__truck'),now:nowEl?nowEl.textContent.trim():'',free:/free/.test(cls),blocked:/blocked/.test(cls),off:/off/.test(cls),el:b}})}
  function rowOf(el){let n=el;while(n&&!n.querySelector('.binfo')&&!n.classList.contains('planner'))n=n.parentElement;return n&&n.querySelector('.binfo')?n:null}
  function options(){return rows().map(r=>({id:r.id,ini:r.ini,name:r.name,vehicle:/·/.test(r.veh)?r.veh:'',sub:r.free?'Free · '+r.now.replace(/^Available\s*·?\s*/,''):r.now,ok:r.free,bad:r.blocked})).sort((a,b)=>b.ok-a.ok).slice(0,8)}
  function tripFrom(card){
    const row=card.closest('.upop')?null:rowOf(card),info=row&&row.querySelector('.binfo');
    const route=txt(card,'.bcard__route').replace(/\s*\+\d+ stops?$/,'').replace(/\s*Day \d+ of \d+$/,'');const parts=route.split('→').map(x=>x.trim());
    const when=txt(card,'.bcard__when'),times=when.match(/\d{2}:\d{2}/g)||[];
    const idm=(card.getAttribute('aria-label')||'').match(/TRP-\d+/);const status=TONE[card.dataset.tone]||'assigned';
    const eta=txt(card,'.bcard__eta').replace(/^ETA\s*/,'');const delay=+(txt(card,'.bcard__status').match(/\+(\d+)m/)||[])[1]||null;
    const issue=txt(card,'.bcard__issue');
    const name=info?txt(info,'.binfo__name'):'';
    return {id:idm?idm[0]:'TRP',from:parts[0]||route,to:parts[parts.length-1]||'',client:txt(card,'.bcard__client')||'—',date:dateLabel(),s:times[0]||'—',e:times[1]||(when||'—'),status:status==='delayed'&&!delay?'assigned':status,delay,eta,
      progress:status==='transit'||status==='delayed'?.5:null,remaining:eta?'ETA '+eta:'',
      stops:[{kind:'Pickup',place:parts[0]||'',addr:'',when:times[0]||'',done:status==='transit'||status==='delayed'||status==='completed'},{kind:'Delivery',place:parts[parts.length-1]||'',addr:'',when:eta?'ETA '+eta:(times[1]||''),bad:status==='delayed'}],
      driver:info?{id:name,ini:txt(info,'.avatar'),name,sub:[txt(card,'.bcard__vehicle'),info.querySelector('.binfo__now')?.textContent.trim()].filter(Boolean).join(' · '),dot:status==='delayed'?'#E5484D':'#8A847E',phone:''}:null,
      cargo:'',price:null,payment:'Invoice after delivery',next:issue?{text:issue,bad:true}:null,docs:[],assignBy:'departure'};
  }
  const ctx={
    driverOptions:()=>options(),
    actions:{
      openDriver:name=>{const r=rows().find(x=>x.name===name);if(r){r.el.querySelector('.binfo__head').click()}},
      assign:(t,name)=>toast2(`In the prototype, drag ${t.id} onto ${name}’s row to assign it.`),
      cancel:t=>toast2(`${t.id} cancelled (demo — the board is not changed)`),
      endTrip:(t,r)=>({...t,status:'completed',result:r,deliveredAt:'now',deliveredNote:r.file?'Signed note attached · '+r.file:'Closed from the planner'}),
      invoice:t=>toast2('Invoice draft created for '+t.client),
      duplicate:t=>openCreate({client:t.client,pickup:t.from,delivery:t.to})
    }};
  function toast2(m){const t=document.createElement('div');t.className='fxd-toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
  window.toast=window.toast||toast2;
  function openCreate(preset){
    const clients=[...new Set([...document.querySelectorAll('.bcard__client')].map(n=>n.textContent.trim()).filter(Boolean))].sort();
    FxTrip.create({today:new Date().toISOString().slice(0,10),preset,clients,vehicles:[...new Set(rows().map(r=>r.veh).filter(v=>/·/.test(v)))],
      dateLabel:v=>{const d=new Date(v+'T12:00');return isNaN(d)?v:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}).replace(',','').replace('Sept','Sep')},
      driverOptions:()=>options(),
      onCreate:d=>toast2(`Trip ${d.from} → ${d.to} created (demo — add it to the board by dragging)`)});
  }
  document.addEventListener('click',e=>{
    const card=e.target.closest('.bcard');
    if(card){e.preventDefault();e.stopPropagation();FxTrip.details(tripFrom(card),ctx);return}
    const b=e.target.closest('button');if(!b)return;
    const label=b.textContent.trim();
    if(b.classList.contains('badd')){e.preventDefault();e.stopPropagation();const row=rowOf(b);const name=row?txt(row,'.binfo__name'):'';openCreate({driver:name});return}
    if(/^New trip( without driver)?$/.test(label)){e.preventDefault();e.stopPropagation();openCreate({});}
  },true);
})();
</script>

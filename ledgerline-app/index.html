<title>Ledgerline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --bg:#FFFFFF; --side:#F7F7F5; --sunk:#F5F5F2; --chip:#F0F0EC;
  --hover:#EFEFEB; --active:#E9E9E4; --row-hover:#FAFAF8;
  --line:#E8E7E3; --line-2:#F1F0EC; --line-strong:#DDDCD6;
  --ink:#1B1B18; --ink-2:#3D3C37; --muted:#6B6A63; --faint:#8E8D85;
  --accent:#2946C8; --accent-hover:#1F38A6; --accent-ink:#FFFFFF; --accent-soft:#EEF1FC; --accent-line:#D3DBF7; --accent-text:#2440B8;
  --amber-bg:#FCF0DA; --amber:#854800; --amber-line:#F0D9AE; --amber-soft:#FFFAF0; --amber-mark:#B86A00;
  --green-bg:#E2F2E8; --green:#17613C; --green-mark:#1F7A4D;
  --red-bg:#FBE7E4; --red:#A3231B; --red-line:#F2C9C3; --red-mark:#C0392B;
  --blue-bg:#E9EDFC; --blue:#2440B8;
  --gray-bg:#F1F1EE; --gray:#55544E;
  --scrim:rgba(24,24,20,.36);
  --shadow:0 1px 2px rgba(24,24,20,.06),0 12px 32px -12px rgba(24,24,20,.22);
  --logo-l:92%; --logo-fl:30%; --logo-s:50%;
  --paper:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121316; --side:#17181C; --sunk:#1B1C21; --chip:#24252B;
    --hover:#202127; --active:#26272E; --row-hover:#18191D;
    --line:#2A2B31; --line-2:#212227; --line-strong:#34353C;
    --ink:#ECECEE; --ink-2:#CACACF; --muted:#9C9CA4; --faint:#7C7C85;
    --accent:#8EA2FF; --accent-hover:#A8B7FF; --accent-ink:#0D1233; --accent-soft:#1B2140; --accent-line:#2E3A6E; --accent-text:#A9B8FF;
    --amber-bg:#3A2A10; --amber:#F2C27A; --amber-line:#5A4217; --amber-soft:#241C0F; --amber-mark:#E0A040;
    --green-bg:#11301F; --green:#7ED6A4; --green-mark:#5CC592;
    --red-bg:#3A1714; --red:#F59C94; --red-line:#5C2520; --red-mark:#EF7A6F;
    --blue-bg:#1B2140; --blue:#A9B8FF;
    --gray-bg:#24252B; --gray:#B9B9C0;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.6);
    --logo-l:24%; --logo-fl:82%; --logo-s:35%;
    --paper:#F7F7F4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121316; --side:#17181C; --sunk:#1B1C21; --chip:#24252B;
  --hover:#202127; --active:#26272E; --row-hover:#18191D;
  --line:#2A2B31; --line-2:#212227; --line-strong:#34353C;
  --ink:#ECECEE; --ink-2:#CACACF; --muted:#9C9CA4; --faint:#7C7C85;
  --accent:#8EA2FF; --accent-hover:#A8B7FF; --accent-ink:#0D1233; --accent-soft:#1B2140; --accent-line:#2E3A6E; --accent-text:#A9B8FF;
  --amber-bg:#3A2A10; --amber:#F2C27A; --amber-line:#5A4217; --amber-soft:#241C0F; --amber-mark:#E0A040;
  --green-bg:#11301F; --green:#7ED6A4; --green-mark:#5CC592;
  --red-bg:#3A1714; --red:#F59C94; --red-line:#5C2520; --red-mark:#EF7A6F;
  --blue-bg:#1B2140; --blue:#A9B8FF;
  --gray-bg:#24252B; --gray:#B9B9C0;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.6);
  --logo-l:24%; --logo-fl:82%; --logo-s:35%;
  --paper:#F7F7F4;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-size:.93em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.cents{font-size:.78em;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column}

/* Shell */
.app{display:grid;grid-template-columns:var(--sidew) minmax(0,1fr);height:100%;--sidew:236px}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px;padding:12px 10px;overflow-y:auto;min-height:0}
.ws{display:flex;align-items:center;gap:10px;height:42px;padding:0 8px;margin-bottom:10px;border-radius:8px}
.ws-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.ws-text{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.ws-text b{font-weight:600;white-space:nowrap}
.ni{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--ink-2);background:none;border:0;width:100%;cursor:pointer;text-align:left;flex:none}
.ni svg{color:var(--muted);flex:none}
.ni:hover{background:var(--hover);color:var(--ink)}
.ni[aria-current="page"]{background:var(--active);color:var(--ink);font-weight:500}
.ni[aria-current="page"] svg{color:var(--ink)}
.ni .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .cnt{font-size:12px;color:var(--muted);font-weight:400}
.sl{font-size:11.5px;color:var(--muted);padding:16px 10px 6px;font-weight:500}
.sync{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px 10px 4px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-mark);flex:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.search{display:flex;align-items:center;gap:8px;flex:0 1 440px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--sunk);color:var(--muted);cursor:text;text-align:left}
.search:hover{border-color:var(--line-strong)}
.search span.ph{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--bg)}
.content{flex:1;overflow:auto;min-height:0}
.page{padding:24px 28px 56px;display:flex;flex-direction:column;gap:20px;max-width:1720px}
.btn.menu-btn{display:none}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:hsl(var(--h,25) var(--logo-s) var(--logo-l));color:hsl(var(--h,25) 45% var(--logo-fl))}
.avatar.sm{width:22px;height:22px;font-size:9.5px}

@media (max-width:1180px){
  .app{--sidew:64px}
  .side{padding:12px 8px;align-items:center}
  .side .lbl,.side .cnt,.side .ws-text,.side .sync span,.side .ws-chev{display:none}
  .side .sl{padding:10px 0 4px;font-size:0;width:28px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .side .ni{justify-content:center;padding:0;width:44px;height:40px;position:relative}
  .side .ni .badge-dot{display:block}
  .ws{padding:0;justify-content:center;width:44px}
  .sync{justify-content:center;padding:12px 0 4px}
  .page{padding:20px 22px 48px}
  .top{padding:0 18px}
}
.ni .badge-dot{display:none;position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--side)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;width:264px;z-index:70;transform:translateX(-102%);transition:transform .2s ease;align-items:stretch;padding:12px 10px;box-shadow:var(--shadow)}
  .app.nav-open .side{transform:none}
  .side .lbl,.side .cnt,.side .ws-text,.side .sync span,.side .ws-chev{display:initial}
  .side .ws-text{display:flex}
  .side .sl{font-size:11.5px;padding:16px 10px 6px;width:auto;border:0;margin:0}
  .side .ni{justify-content:flex-start;padding:0 10px;width:100%;height:36px}
  .side .ni .badge-dot{display:none}
  .ws{padding:0 8px;justify-content:flex-start;width:auto}
  .sync{justify-content:flex-start;padding:12px 10px 4px}
  .btn.menu-btn{display:inline-flex}
  .page{padding:18px 16px 48px}
  .top{padding:0 12px}
  .search .kbd{display:none}
}
.rc{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:16px;align-items:center}
@media (max-width:900px){.rc{grid-template-columns:1fr}.rc > .row{justify-content:flex-start!important}}
.nav-scrim{position:fixed;inset:0;background:var(--scrim);z-index:69}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none!important;flex:none}
.btn:hover{background:var(--sunk)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.lg{height:40px;padding:0 16px}
.icon-btn{width:34px;padding:0}
.icon-btn.sm{width:28px}
.ai-btn{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text)}
.ai-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.inp,.sel,.ta{height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);width:100%}
.ta{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.45}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--accent-line);outline-offset:0;border-color:var(--accent)}
.lbl-f{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;cursor:pointer;vertical-align:middle}
.seg{display:inline-flex;padding:2px;background:var(--chip);border-radius:8px;gap:2px;flex:none}
.seg button{height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.auto[aria-pressed="true"]{color:var(--accent-text)}
.seg button:disabled{cursor:not-allowed;opacity:.55}
.switch{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.pill.gray{background:var(--gray-bg);color:var(--gray)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.ai-mark{display:inline-flex;align-items:center;gap:5px;color:var(--accent-text);font-size:12.5px;font-weight:500}

/* Page header, tabs */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.ph .desc{font-size:13.5px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:40px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap;padding:0;font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.tab .n{font-size:11.5px;background:var(--chip);border-radius:999px;padding:1px 7px;color:var(--muted);font-weight:500}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-inp{display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:var(--bg);width:min(260px,100%)}
.filter-inp input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:13px}
.sel.sm{height:32px;width:auto;font-size:13px;padding:0 8px}

/* Cards, stats */
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card-h h3{font-size:13.5px;font-weight:600}
.card-b{padding:12px 16px 16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--bg);text-align:left;cursor:default}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--line-strong);background:var(--row-hover)}
.stat .v{font-size:20px;font-weight:600;letter-spacing:-.01em}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:10px;flex-wrap:wrap}
.banner .txt{flex:1;min-width:240px}
.meter{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;display:flex}
.meter i{display:block;height:100%;background:var(--accent)}

/* Tables */
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:var(--bg)}
table.t{width:100%;border-collapse:collapse;min-width:680px;font-size:13.5px}
.t th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 12px;height:38px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
.t td{padding:8px 12px;height:54px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--row-hover)}
.t tr.sel td{background:var(--accent-soft)}
.t .r{text-align:right}
.t .wrap{white-space:normal}
.t td.chk,.t th.chk{width:40px;padding-right:0}
@media (max-width:1280px){.hide-lg{display:none}}
@media (max-width:1100px){.hide-md{display:none}}
@media (max-width:880px){.hide-sm{display:none}}
.vcell{display:flex;align-items:center;gap:10px;min-width:0}
.vcell .nm{font-weight:500}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;background:hsl(var(--h) var(--logo-s) var(--logo-l));color:hsl(var(--h) 45% var(--logo-fl))}
.logo.lg{width:40px;height:40px;border-radius:10px;font-size:14px}
.logo.sm{width:24px;height:24px;border-radius:6px;font-size:10px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink);font-weight:600;font-size:14px}
.bulk{position:sticky;bottom:16px;align-self:center;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:var(--ink);color:var(--bg);border-radius:12px;box-shadow:var(--shadow);z-index:5;flex-wrap:wrap}
.bulk .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.25)}
.bulk .btn:hover{background:rgba(255,255,255,.12)}
.bulk .btn.pri{background:var(--bg);color:var(--ink);border-color:var(--bg)}

/* Confidence bars */
.cf{display:inline-flex;align-items:flex-end;gap:2px;height:12px;flex:none}
.cf i{display:block;width:3px;border-radius:1px;background:var(--line-strong)}
.cf i:nth-child(1){height:5px}.cf i:nth-child(2){height:8px}.cf i:nth-child(3){height:12px}
.cf.h i{background:var(--accent)}
.cf.m i:nth-child(-n+2){background:var(--accent)}
.cf.l i:nth-child(1){background:var(--amber-mark)}

/* Drawer, modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;animation:fade .15s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:81;border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .2s ease-out}
.drawer.narrow{width:min(460px,100%)}
@media (min-width:1600px){.drawer{width:760px}.drawer.narrow{width:480px}}
.dh{padding:16px 20px 0;display:flex;flex-direction:column;gap:12px;flex:none}
.db{flex:1;overflow:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
.df{flex:none;border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg)}
.modal-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px}
.modal{width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .16s ease-out;border:1px solid var(--line)}
.modal.sm{width:min(460px,100%)}
.mh{padding:20px 22px 12px;display:flex;gap:12px;align-items:flex-start}
.mb{padding:4px 22px 18px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--sunk);flex-wrap:wrap;border-radius:0 0 14px 14px}
.m-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Bill detail */
.flag-card{border:1px solid var(--amber-line);background:var(--amber-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.flag-card.red{border-color:var(--red-line);background:var(--red-bg)}
.flag-card p{line-height:1.5;color:var(--ink-2);max-width:70ch}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (min-width:1600px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fv{display:flex;align-items:center;gap:8px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg)}
.fv > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv.warn{border-color:var(--amber-line);background:var(--amber-soft)}
.gl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);white-space:nowrap}
.gl.sug{border-style:dashed;border-color:var(--accent-line);color:var(--muted);font-style:italic}

function planFor(db,b){

  const method = eur ? 'SEPA · EUR' : b.amt >= 25000 ? 'Wire' : 'ACH';
  const fee = method==='Wire' ? 15 : 0;

  if (early && diffDays(b.issued, RUN_DATE) <= 10){ discount = Math.round(b.amt*0.02*100)/100; reason = `Early: 2% discount, ${money(discount)}, ends ${fmtD(addDays(b.issued,10))}`; }
  else if (b.due <= RUN_DATE) reason = b.due < RUN_DATE ? 'Overdue' : 'Due tomorrow';
  else if (b.due < NEXT_RUN) reason = `Due ${fmtD(b.due)}, before the next run on ${fmtD(NEXT_RUN)}`;
  else { reason = `Not due until ${fmtD(b.due)}. Next run on ${fmtD(NEXT_RUN)} is soon enough.`; include = false; }
  if (eur) reason = `€${b.fx.amt.toLocaleString('en-US',{minimumFractionDigits:2})} at ${b.fx.rate} · ` + reason;
  const arrives = method==='Wire' ? RUN_DATE : eur ? addDays(RUN_DATE,2) : addDays(RUN_DATE,1);
  if (db.run.exclude[b.id] !== undefined) include = !db.run.exclude[b.id];
  return {method,fee,fxCost,discount,reason,include,arrives};
}

const START_BAL = 1284900;
function forecast(db, days, runInclude){
  const end = addDays(TODAY, days);
  const ev = {}; const add = (d,a,label,kind) => { if (d<TODAY || d>end) return; (ev[d]=ev[d]||[]).push({a,label,kind}); };
  for (let d = '2026-10-30'; d <= end; d = addDays(d,14)) add(d,-236000,'Payroll','payroll');
  ['2026-11-01','2026-12-01','2027-01-01'].forEach(d=>add(d,-48500,'Rent, Fremont facility','rent'));
  for (let d='2026-11-02'; d<=end; d=addDays(d,7)) add(d,64000,'Customer receipts (weekly average)','in');
  add('2026-11-20',180000,'Helix Robotics, milestone 3','in');
  add('2026-12-18',210000,'Orbit Automation, milestone 1','in');
  db.bills.forEach(b=>{
    const vn = vendorOf(db,b).name;
    if (b.status==='scheduled') add(b.payOn,-b.amt,vn,'bill');
    else if (b.status==='approved'){ const inc = runInclude ? runInclude(b) : true; add(inc?RUN_DATE:b.due,-b.amt,vn,'bill'); }
    else if (['approval','ready','review'].includes(b.status)) add(b.due < TODAY ? addDays(TODAY,1) : b.due,-b.amt,vn,'expected');
  });
  const pts = []; let bal = START_BAL; const events = [];
  for (let i=0;i<=days;i++){ const d = addDays(TODAY,i); if (i>0) bal -= 2800; (ev[d]||[]).forEach(e=>{ bal += e.a; events.push({d,...e}); }); pts.push({d,v:bal}); }
  let low = pts[0]; pts.forEach(p=>{ if (p.v < low.v) low = p; });
  return {pts,low,events,endBal:pts[pts.length-1].v};
}
function niceTicks(min,max,count=4){
  const span = max-min; const step0 = span/count; const mag = Math.pow(10,Math.floor(Math.log10(step0))); const norm = step0/mag;
  const step = (norm<1.5?1:norm<3?2:norm<7?5:10)*mag; const lo = Math.floor(min/step)*step; const hi = Math.ceil(max/step)*step;
  const t=[]; for (let v=lo; v<=hi+1e-6; v+=step) t.push(v); return t;
}
function LineChart({pts, floor, h=220, label}){
  const W=760, H=h, L=58, R=16, T=14, B=28;
  const vals = pts.map(p=>p.v).concat([floor]);
  const ticks = niceTicks(Math.min(...vals)*0.96, Math.max(...vals)*1.02);
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = i => L + (W-L-R) * (i/(pts.length-1));
  const Y = v => T + (H-T-B) * (1 - (v-y0)/(y1-y0));
  const line = pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area = line + ` L${X(pts.length-1).toFixed(1)} ${H-B} L${L} ${H-B} Z`;
  let low = 0; pts.forEach((p,i)=>{ if (p.v < pts[low].v) low = i; });
  const below = pts.find(p=>p.v<floor);
  const nx = Math.min(5, pts.length-1); const xt = []; for (let k=0;k<=nx;k++) xt.push(Math.round(k*(pts.length-1)/nx));
  const lowX = X(low), lowAnchor = lowX > W-120 ? 'end' : lowX < L+60 ? 'start' : 'middle';
  return html`<svg className="chart" viewBox=${`0 0 ${W} ${H}`} width="100%" role="img" aria-label=${label}>
    ${ticks.map(t=>html`<g key=${t}><line x1=${L} x2=${W-R} y1=${Y(t)} y2=${Y(t)} stroke="var(--line-2)"/><text x=${L-8} y=${Y(t)+4} textAnchor="end" fontSize="11" fill="var(--muted)">${kfmt(t)}</text></g>`)}
    <path d=${area} fill="var(--accent-soft)"/>
    <line x1=${L} x2=${W-R} y1=${Y(floor)} y2=${Y(floor)} stroke="var(--red-mark)" strokeDasharray="5 4"/>
    <text x=${W-R} y=${Y(floor)-6} textAnchor="end" fontSize="11" fill="var(--red)">Floor ${kfmt(floor)}</text>

    <circle cx=${X(low)} cy=${Y(pts[low].v)} r="4" fill="var(--bg)" stroke=${below?'var(--red-mark)':'var(--accent)'} strokeWidth="2"/>
    <text x=${lowX} y=${Y(pts[low].v)+18} textAnchor=${lowAnchor} fontSize="11.5" fontWeight="600" fill="var(--ink)">${kfmt(pts[low].v)} low · ${fmtD(pts[low].d)}</text>

}

/* ---------- App ---------- */
const NAV = [
  ['home','Home','home'],['bills','Bills','bills'],['approvals','Approvals','approvals'],['payments','Payments','payments'],['vendors','Vendors','vendors'],['pos','Purchase orders','po'],['recon','Reconciliation','recon'],

];
const PAGE_TITLE = Object.fromEntries(NAV.filter(n=>n[0]!=='-').map(n=>[n[0],n[1]]));

function loadDb(){ try { const s = localStorage.getItem(STORE_KEY); if (s) return JSON.parse(s); } catch(e){} return seed(); }

function App(){
  const [db,setDb] = useState(loadDb);
  const [page,setPage] = useState(()=>{ const h=(location.hash||'').slice(1); return PAGE_TITLE[h]?h:'home'; });
  const [tabs,setTabs] = useState({bills:'review',approvals:'mine',payments:'run',pos:'open',recon:'attention',settings:'company',vendorsCat:'all'});
  const [drawer,setDrawer] = useState(null);
  const [modal,setModal] = useState(null);
  const [ask,setAsk] = useState(null);
  const [palette,setPalette] = useState(false);
  const [navOpen,setNavOpen] = useState(false);
  const [toasts,setToasts] = useState([]);
  const [notifOpen,setNotifOpen] = useState(false);

  useEffect(()=>{ try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch(e){} },[db]);
  useEffect(()=>{ const k = e => {
      if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); setPalette(p=>!p); }
      else if (e.key==='Escape'){ if (palette) setPalette(false); else if (modal) setModal(null); else if (drawer) setDrawer(null); else if (ask) setAsk(null); else if (notifOpen) setNotifOpen(false); else if (navOpen) setNavOpen(false); }
    }; window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k); },[palette,modal,drawer,ask,notifOpen,navOpen]);

  const toast = useCallback((msg, undoId) => { const id = uid('t'); setToasts(t=>[...t,{id,msg,undoId}]); setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 5200); },[]);
  const mutate = useCallback(fn => setDb(d => { const n = clone(d); fn(n); return n; }),[]);
  const log = (n, entry) => { n.clock += 1 + Math.floor(Math.random()*2); const e = {id:uid('a'),day:'Today',t:clockLabel(n.clock),...entry}; n.activity.unshift(e); return e.id; };

  const nav = (p, opts={}) => { setPage(p); setNavOpen(false); setDrawer(null); if (opts.tab) setTabs(t=>({...t,[opts.tabKey||p]:opts.tab})); try { history.replaceState(null,'','#'+p); } catch(e){} const c = document.querySelector('.content'); if (c) c.scrollTop = 0; };
  const setTab = (k,v) => setTabs(t=>({...t,[k]:v}));

  /* Actions */
  const act = {
    setStatus(ids, to, extra={}, verb){
      ids = [].concat(ids); let entryId;
      mutate(n => { ids.forEach(id=>{ const b = n.bills.find(x=>x.id===id); if (!b) return; const from = b.status; b.status = to; Object.assign(b, typeof extra==='function'? extra(b,n) : extra);
        entryId = log(n,{actor:ME,kind:'Bill',text:`${verb||('Moved to '+to)}: ${vendorOf(n,b).name} ${b.num}`,billId:b.id,undo:{billId:b.id,from,to}}); }); });
      return entryId;
    },
    submit(ids){
      ids = [].concat(ids); const pending = [];
      mutate(n=>{ ids.forEach(id=>{ const b=n.bills.find(x=>x.id===id); if (!b || b.flags.length) return; const from=b.status; b.lines.forEach(l=>l.sug=false); b.status='approval'; b.approver=approverFor(b); b.submittedBy=ME;
        log(n,{actor:ME,kind:'Submission',text:`Submitted ${vendorOf(n,b).name} ${b.num} for approval`,out:`Routed to ${b.approver===ME?'you':b.approver}`,billId:b.id,undo:{billId:b.id,from,to:'approval'}});
        if (b.approver!==ME) pending.push({id:b.id,who:b.approver,name:vendorOf(n,b).name+' '+b.num}); }); });
      toast(ids.length>1 ? `Submitted ${ids.length} bills for approval` : 'Submitted for approval');
      pending.forEach((p,i)=>setTimeout(()=>{ mutate(n=>{ const b=n.bills.find(x=>x.id===p.id); if (b && b.status==='approval'){ b.status='approved'; b.approvedBy=p.who; log(n,{actor:p.who,kind:'Approval',text:`Approved ${p.name}`,out:'Added to the next payment run',billId:b.id}); } }); toast(`${p.who} approved ${p.name}`); }, 3800 + i*900));
    },
    approve(ids){ ids=[].concat(ids); mutate(n=>{ ids.forEach(id=>{ const b=n.bills.find(x=>x.id===id); if(!b) return; const from=b.status; b.status='approved'; b.approvedBy=ME; log(n,{actor:ME,kind:'Approval',text:`Approved ${vendorOf(n,b).name} ${b.num}, ${money(b.amt)}`,out:'Added to the next payment run',billId:b.id,undo:{billId:b.id,from,to:'approved'}}); }); }); toast(ids.length>1?`Approved ${ids.length} bills`:'Approved. Added to the next payment run.'); },
    reject(id, reason){ mutate(n=>{ const b=n.bills.find(x=>x.id===id); const from=b.status; b.status='review'; b.flags.push({type:'rejected',reason}); log(n,{actor:ME,kind:'Approval',text:`Returned ${vendorOf(n,b).name} ${b.num} to AP`,out:reason,billId:b.id,undo:{billId:b.id,from,to:'review'}}); }); toast('Returned to AP with your note'); },
    resolve(id, type, how, patch){ mutate(n=>{ const b=n.bills.find(x=>x.id===id); b.flags = b.flags.filter(f=>f.type!==type); if (patch) patch(b,n); if (!b.flags.length && (b.status==='review'||b.status==='hold')) b.status='ready';
      log(n,{actor:ME,kind:'Review',text:`${how} on ${vendorOf(n,b).name} ${b.num}`,out:b.status==='ready'?'Ready to submit':'Still needs review',billId:b.id}); }); },
    acceptLine(id, idx){ mutate(n=>{ const b=n.bills.find(x=>x.id===id); b.lines[idx].sug=false; b.lines[idx].c='h'; log(n,{actor:ME,kind:'Smart Coding',text:`Accepted ${glName(b.lines[idx].gl)} on ${b.num}`,out:'Autopilot will reuse this',billId:b.id}); }); },
    setLineGl(id, idx, gl){ mutate(n=>{ const b=n.bills.find(x=>x.id===id); const old=b.lines[idx].gl; b.lines[idx].gl=gl; b.lines[idx].sug=false; b.lines[idx].c='h'; log(n,{actor:ME,kind:'Correction',text:`Changed GL on ${b.num} from ${old} to ${glName(gl)}`,out:'Autopilot learned this rule',billId:b.id}); }); toast('Account updated. Autopilot will learn from this.'); },
    voidBill(id){ let e; mutate(n=>{ const b=n.bills.find(x=>x.id===id); const from=b.status; b.status='void'; b.flags=[]; e=log(n,{actor:ME,kind:'Guardrails',text:`Voided ${vendorOf(n,b).name} ${b.num} as a duplicate`,out:`Saved ${money(b.amt)}`,billId:b.id,undo:{billId:b.id,from,to:'void'}}); }); setDrawer(null); toast('Voided as a duplicate', e); },
    verifyBank(id, cosigner){ mutate(n=>{ const b=n.bills.find(x=>x.id===id); const v=vendorOf(n,b); v.bank={name:v.pendingBank.name,last4:v.pendingBank.last4,routing:v.pendingBank.routing,verified:TODAY}; delete v.pendingBank; b.flags=b.flags.filter(f=>f.type!=='bank'); if(!b.flags.length) b.status='ready';
      log(n,{actor:ME,kind:'Guardrails',text:`Verified new bank details for ${v.name} by phone`,out:`Co-approved by ${cosigner}`,billId:b.id}); }); setModal(null); toast('Bank details verified. Bill is ready to submit.'); },
    reportFraud(id){ mutate(n=>{ const b=n.bills.find(x=>x.id===id); const v=vendorOf(n,b); b.status='void'; b.flags=[]; delete v.pendingBank; log(n,{actor:ME,kind:'Guardrails',text:`Reported ${b.num} as payment-redirection fraud`,out:'Vendor notified on the number on file',billId:b.id}); }); setModal(null); setDrawer(null); toast('Reported as fraud. The bill is void and the vendor record is unchanged.'); },
    releaseRun(list, cosigner){ const total = list.reduce((s,x)=>s+x.b.amt,0); mutate(n=>{ list.forEach(({b,p})=>{ const nb=n.bills.find(x=>x.id===b.id); nb.status='scheduled'; nb.payOn=RUN_DATE; nb.method=p.method; }); n.run.exclude={};
      log(n,{actor:ME,kind:'Payment run',text:`Released the Oct 28 payment run: ${list.length} bills, ${money(total)}`,out:cosigner?`Co-signed by ${cosigner}`:'Single approver'}); }); setModal(null); toast(`Released ${list.length} payments. They leave Operating ··2502 on Oct 28.`); setTab('payments','scheduled'); },
    cancelPayment(id){ const e = act.setStatus(id,'approved',{payOn:null},'Cancelled payment'); toast('Payment cancelled. The bill is back in To pay.'); },
    settle(ids){ ids=[].concat(ids); mutate(n=>{ ids.forEach(id=>{ const b=n.bills.find(x=>x.id===id); b.status='paid'; b.paidOn=b.payOn||TODAY; log(n,{actor:'ai',kind:'Reconciliation',text:`Matched the bank debit for ${vendorOf(n,b).name} ${b.num}`,out:'Paid and reconciled',billId:b.id}); n.txns.unshift({id:uid('t'),date:b.paidOn,desc:'ACH DEBIT '+vendorOf(n,b).name.toUpperCase(),amt:-b.amt,status:'matched',match:b.id,conf:100,by:'Autopilot'}); }); }); toast(ids.length>1?`${ids.length} payments settled and reconciled`:'Payment settled and reconciled'); },
    toggleRun(id, include){ mutate(n=>{ n.run.exclude[id] = !include; }); },
    setLevel(ruleId, level){ mutate(n=>{ const r=n.rules.find(x=>x.id===ruleId); const old=r.level; r.level=level; log(n,{actor:ME,kind:'Autopilot',text:`Changed ${r.name} from ${old} to ${level}`,out:level==='autopilot'?`Limits: ${money(r.capBill||0,0)} per bill`:'No auto-approvals'}); }); toast('Autopilot level updated'); },
    setCap(ruleId, key, val){ mutate(n=>{ const r=n.rules.find(x=>x.id===ruleId); r[key]=Math.max(0,Number(val)||0); }); },
    setVendorLevel(vid, level){ mutate(n=>{ const v=n.vendors.find(x=>x.id===vid); v.level=level; log(n,{actor:ME,kind:'Autopilot',text:`Set ${v.name} to ${level}`}); }); toast('Vendor Autopilot level updated'); },
    promote(){ mutate(n=>{ n.promoted=true; const v=n.vendors.find(x=>x.id==='nw'); v.level='autopilot'; n.rules.splice(4,0,{id:'r8',name:'Northwind Freight',sub:'Promoted today',level:'autopilot',capBill:20000,capDay:40000,acc:'100%',n:41}); log(n,{actor:ME,kind:'Autopilot',text:'Moved Northwind Freight to Autopilot',out:'Limit $20,000 per bill'}); }); toast('Northwind Freight now runs on Autopilot'); },
    recon(tid, what, extra){ mutate(n=>{ const t=n.txns.find(x=>x.id===tid); if (what==='accept'){ t.status='matched'; t.by=ME; log(n,{actor:ME,kind:'Reconciliation',text:`Matched ${t.desc} to ${n.bills.find(b=>b.id===t.match).num}`}); }
      else if (what==='reject'){ t.status='unmatched'; t.hint='You rejected the suggested match. Pick a bill or book it as an expense.'; t.match=null; }
      else if (what==='expense'){ t.status='matched'; t.by=ME; t.booked=glName(extra); log(n,{actor:ME,kind:'Reconciliation',text:`Booked ${t.desc} to ${glName(extra)}`}); }
      else if (what==='deposit'){ t.status='matched'; t.by=ME; t.booked='Receivables'; log(n,{actor:ME,kind:'Reconciliation',text:`Sent ${t.desc} to Receivables`}); }
      else if (what==='receipt'){ t.requested=true; log(n,{actor:ME,kind:'Reconciliation',text:'Asked Marcus Chen for a receipt: '+t.desc}); }
      else if (what==='link'){ t.status='matched'; t.match=extra; t.by=ME; t.conf=100; log(n,{actor:ME,kind:'Reconciliation',text:`Matched ${t.desc} to ${n.bills.find(b=>b.id===extra).num}`}); } });
      toast(what==='receipt'?'Receipt request sent to Marcus Chen':what==='reject'?'Suggestion rejected':'Transaction reconciled'); },
    holdRenewals(){ mutate(n=>{ n.renewalsHeld=true; log(n,{actor:ME,kind:'Ask Ledger',text:'Held 3 unused renewals: Loomwise, Tabula Forms, Stackpad',out:'Saves $2,140 a month'}); }); toast('Held 3 renewals. Owners were notified.'); },
    undo(entryId){ let ok=false; mutate(n=>{ const e=n.activity.find(x=>x.id===entryId); if (!e||!e.undo||e.undone) return; const b=n.bills.find(x=>x.id===e.undo.billId); if (!b || b.status!==e.undo.to) return; b.status=e.undo.from; e.undone=true; ok=true; log(n,{actor:ME,kind:'Undo',text:`Undid: ${e.text}`,billId:b.id}); }); toast('Undone'); },
    addBill(b){ mutate(n=>{ n.bills.unshift(b); log(n,{actor:'ai',kind:'Invoice Autopilot',text:`Read ${b.num} from ${vendorOf(n,b).name}. All fields confident.`,out:'Ready to submit',billId:b.id}); }); },
    setSetting(path, val){ mutate(n=>{ const ks=path.split('.'); let o=n.settings; ks.slice(0,-1).forEach(k=>o=o[k]); o[ks[ks.length-1]]=val; }); },
    reset(){ const s = seed(); setDb(s); setDrawer(null); setModal(null); toast('Demo data reset'); },
    auditDone(){ mutate(n=>{ n.auditWaiting = Math.max(0,n.auditWaiting-1); log(n,{actor:ME,kind:'Audit sample',text:'Checked 1 auto-approved software bill',out:'No issues'}); }); toast('Sample checked. No issues found.'); },
  };

  const openBill = id => setDrawer({type:'bill',id});
  const ctx = {db,act,nav,tabs,setTab,openBill,setDrawer,setModal,toast,setAsk};

  const counts = {
    bills: db.bills.filter(b=>b.status==='review'||b.status==='hold').length,
    approvals: db.bills.filter(b=>b.status==='approval'&&b.approver===ME).length,
    recon: db.txns.filter(t=>t.status!=='matched').length,
  };

  const Page = {home:HomePage,bills:BillsPage,approvals:ApprovalsPage,payments:PaymentsPage,vendors:VendorsPage,pos:POPage,recon:ReconPage,spend:SpendPage,forecast:ForecastPage,autopilot:AutopilotPage,activity:ActivityPage,settings:SettingsPage}[page];

  return html`<div className=${cx('app', navOpen&&'nav-open')}>
    ${navOpen && html`<div className="nav-scrim" onClick=${()=>setNavOpen(false)}></div>`}
    <nav className="side" aria-label="Main">
      <div className="ws"><div className="ws-mark">K</div><div className="ws-text"><b>Kestrel Robotics</b><span className="sub">Ledgerline</span></div><span className="ws-chev spacer"></span><${Icon} n="updown" s=${14} cls="ws-chev muted"/></div>
      ${NAV.map((n,i)=> n[0]==='-' ? html`<div key=${'s'+i} className="sl">${n[1]}</div>` :
        html`<button key=${n[0]} className="ni" aria-current=${page===n[0]?'page':undefined} onClick=${()=>nav(n[0])} title=${n[1]}>
          <${Icon} n=${n[2]}/><span className="lbl">${n[1]}</span>${counts[n[0]]?html`<span className="cnt num">${counts[n[0]]}</span><span className="badge-dot"></span>`:null}
        </button>`)}
      <div className="sync"><span className="dot"></span><span>NetSuite synced 2 min ago</span></div>
    </nav>
    <div className="main">
      <header className="top">
        <button className="btn icon-btn ghost menu-btn" aria-label="Open menu" onClick=${()=>setNavOpen(true)}><${Icon} n="menu"/></button>
        <button className="search" onClick=${()=>setPalette(true)} aria-label="Search or jump to"><${Icon} n="search" s=${15}/><span className="ph">Search bills, vendors or pages</span><span className="kbd">⌘K</span></button>
        <div className="spacer"></div>
        <button className="btn ai-btn" onClick=${()=>setAsk(a=>a?null:{seed:null})}><${Spark} s=${13}/>Ask Ledger</button>
        <div style=${{position:'relative'}}>
          <button className="btn icon-btn ghost" aria-label="Notifications" aria-expanded=${notifOpen} onClick=${()=>setNotifOpen(o=>!o)}><${Icon} n="bell"/></button>
          ${notifOpen && html`<${Notifications} ctx=${ctx} close=${()=>setNotifOpen(false)}/>`}
        </div>
        <div className="avatar" style=${{'--h':25}} title="Dana Nguyen, Controller">DN</div>
      </header>
      <div className="content"><${Page} ctx=${ctx}/></div>
    </div>
    ${drawer && html`<div className="scrim" onClick=${()=>setDrawer(null)}></div>`}
    ${drawer && drawer.type==='bill' && html`<${BillDrawer} ctx=${ctx} id=${drawer.id} close=${()=>setDrawer(null)}/>`}
    ${drawer && drawer.type==='vendor' && html`<${VendorDrawer} ctx=${ctx} id=${drawer.id} close=${()=>setDrawer(null)}/>`}
    ${drawer && drawer.type==='po' && html`<${PODrawer} ctx=${ctx} id=${drawer.id} close=${()=>setDrawer(null)}/>`}
    ${drawer && drawer.type==='activity' && html`<${ActivityDrawer} ctx=${ctx} id=${drawer.id} close=${()=>setDrawer(null)}/>`}
    ${modal && html`<${ModalHost} ctx=${ctx} modal=${modal} close=${()=>setModal(null)}/>`}
    ${ask && html`<${AskPanel} key=${ask.seed||'ask'} ctx=${ctx} seedQ=${ask.seed} close=${()=>setAsk(null)}/>`}
    ${palette && html`<${Palette} ctx=${ctx} close=${()=>setPalette(false)}/>`}
    <div className="toasts" role="status" aria-live="polite">${toasts.map(t=>html`<div key=${t.id} className="toast"><span>${t.msg}</span>${t.undoId?html`<button onClick=${()=>{act.undo(t.undoId); setToasts(x=>x.filter(y=>y.id!==t.id));}}>Undo</button>`:null}</div>`)}</div>
  </div>`;

/* ---------- Shared bits ---------- */
function VLogo({v, size}){ return html`<div className=${cx('logo',size)} style=${{'--h':v.h}} aria-hidden="true">${v.ini}</div>`; }
function Tabs({items, value, onChange, label}){
  return html`<div className="tabs" role="tablist" aria-label=${label}>${items.map(([k,l,n])=>html`<button key=${k} role="tab" className="tab" aria-selected=${value===k} onClick=${()=>onChange(k)}>${l}${n!==undefined&&n!==null?html`<span className="n num">${n}</span>`:null}</button>`)}</div>`;
}

function Empty({title, text, action}){ return html`<div className="empty"><${Icon} n="check" s=${22} cls="ok"/><b>${title}</b><span>${text}</span>${action}</div>`; }
function Drawer({close, children, head, foot, narrow, label}){

function CloseBtn({close}){ return html`<button className="btn icon-btn ghost" aria-label="Close" onClick=${close}><${Icon} n="x"/></button>`; }
function Switch({on, onChange, label}){ return html`<button className="switch" role="switch" aria-checked=${!!on} aria-label=${label} onClick=${()=>onChange(!on)}></button>`; }

/* ---------- Home ---------- */
function HomePage({ctx}){
  const {db,nav,openBill,act} = ctx;
  const review = db.bills.filter(b=>b.status==='review'||b.status==='hold');
  const mine = db.bills.filter(b=>b.status==='approval'&&b.approver===ME);
  const toPay = db.bills.filter(b=>b.status==='approved');
  const ready = db.bills.filter(b=>b.status==='ready');
  const recon = db.txns.filter(t=>t.status!=='matched');
  const fc = forecast(db,30);
  const upcoming = db.bills.filter(b=>['scheduled','approved','approval'].includes(b.status)).map(b=>({b,d:b.status==='scheduled'?b.payOn:b.due})).filter(x=>x.d<=addDays(TODAY,14)).sort((a,b)=>a.d<b.d?-1:1);
  const tasks = [
    review.length && {icon:'bills',t:`${review.length} bills need review`,s:`${review.filter(b=>b.status==='hold').length} held by guardrails, ${review.filter(b=>b.status==='review').length} with a question`,go:()=>nav('bills',{tab:'review'}),tone:'amber'},
    mine.length && {icon:'approvals',t:`${mine.length} approvals waiting for you`,s:money(mine.reduce((s,b)=>s+b.amt,0))+' in total',go:()=>nav('approvals',{tab:'mine'})},
    ready.length && {icon:'send',t:`${ready.length} bills ready to submit`,s:'Coded by Autopilot, no questions',go:()=>nav('bills',{tab:'ready'})},
    toPay.length && {icon:'payments',t:`Payment run for ${fmtD(RUN_DATE)} is ready`,s:`${toPay.length} approved bills to review and release`,go:()=>nav('payments',{tab:'run'})},
    recon.length && {icon:'recon',t:`${recon.length} bank transactions need a person`,s:'Autopilot matched the rest',go:()=>nav('recon',{tab:'attention'})},
    db.auditWaiting && {icon:'shield',t:`${db.auditWaiting} audit samples to check`,s:'Auto-approved bills picked at random',go:()=>nav('autopilot')},
  ].filter(Boolean);
  const spark = fc.pts.filter((_,i)=>i%2===0);
  const smin = Math.min(...spark.map(p=>p.v)), smax = Math.max(...spark.map(p=>p.v));
  const sp = spark.map((p,i)=>`${(i/(spark.length-1)*300).toFixed(1)},${(56-(p.v-smin)/(smax-smin||1)*48).toFixed(1)}`).join(' ');
  return html`<div className="page">

function BillsPage({ctx}){
  const {db,tabs,setTab,openBill,act,setModal} = ctx;
  const tab = tabs.bills; const [q,setQ] = useState(''); const [vf,setVf] = useState(''); const [sel,setSel] = useState({});
  useEffect(()=>setSel({}),[tab]);
  const def = TAB_DEF.find(t=>t[0]===tab);
  const ql = q.trim().toLowerCase();
  const rows = db.bills.filter(def[2]).filter(b=>!vf||b.v===vf).filter(b=>{ if(!ql) return true; const v=vendorOf(db,b); return (v.name+' '+b.num+' '+b.amt.toFixed(2)).toLowerCase().includes(ql); })
    .sort((a,b)=> tab==='paid' ? (a.paidOn<b.paidOn?1:-1) : (a.due<b.due?-1:1));
  const selIds = Object.keys(sel).filter(k=>sel[k] && rows.some(r=>r.id===k));
  const selRows = rows.filter(r=>selIds.includes(r.id));
  const count = k => db.bills.filter(TAB_DEF.find(t=>t[0]===k)[2]).length;
  const sum = f => db.bills.filter(f).reduce((s,b)=>s+b.amt,0);
  const allSel = rows.length && selIds.length===rows.length;
  const canSelect = ['ready','approval','approved','scheduled'].includes(tab);
  const sumSel = selRows.reduce((s,b)=>s+b.amt,0);
  const bulk = () => {
    if (tab==='ready') return html`<button className="btn sm pri" onClick=${()=>{act.submit(selIds); setSel({});}}>Submit ${selIds.length} for approval</button>`;
    if (tab==='approval'){ const mine = selRows.filter(b=>b.approver===ME).map(b=>b.id); return html`<button className="btn sm pri" disabled=${!mine.length} onClick=${()=>{act.approve(mine); setSel({});}}>Approve ${mine.length} of yours</button>`; }
    if (tab==='approved') return html`<button className="btn sm pri" onClick=${()=>ctx.nav('payments',{tab:'run'})}>Open payment run</button>`;
    if (tab==='scheduled') return html`<button className="btn sm pri" onClick=${()=>{act.settle(selIds); setSel({});}}>Mark ${selIds.length} as settled</button>`;
  };
  const lastCol = tab==='review' ? 'Why it needs you' : 'Status';
  return html`<div className="page">
    <div className="ph"><div><h1>Bills</h1><div className="desc">Forward invoices to <span className="mono" style=${{color:'var(--ink)'}}>bills@kestrel.ledgerline.com</span></div></div><div className="spacer"></div>
      <button className="btn" onClick=${()=>setModal({type:'upload'})}><${Icon} n="upload" s=${15}/>Upload</button>
      <button className="btn pri" onClick=${()=>setModal({type:'upload'})}><${Icon} n="plus" s=${15}/>New bill</button></div>
    <div className="stats">
      <button className="stat" onClick=${()=>setTab('bills','review')}><span className="sub">Needs review · ${count('review')}</span><span className="v"><${Money} n=${sum(TAB_DEF[0][2])}/></span></button>
      <button className="stat" onClick=${()=>setTab('bills','approval')}><span className="sub">In approval · ${count('approval')}</span><span className="v"><${Money} n=${sum(TAB_DEF[2][2])}/></span></button>
      <button className="stat" onClick=${()=>setTab('bills','scheduled')}><span className="sub">Scheduled · ${count('scheduled')}</span><span className="v"><${Money} n=${sum(TAB_DEF[4][2])}/></span></button>
      <button className="stat" onClick=${()=>{setTab('bills','all'); setQ('');}}><span className="sub" style=${{color:'var(--red)'}}>Overdue · ${db.bills.filter(isOverdue).length}</span><span className="v"><${Money} n=${sum(isOverdue)}/></span></button>
    </div>
    ${tab==='review' && count('ready')>0 && html`<div className="banner"><${Spark} s=${15}/><div className="txt"><b style=${{fontWeight:600}}>${count('ready')} bills are coded and ready.</b> <span className="muted">Autopilot had no questions about them.</span></div><button className="btn sm pri" onClick=${()=>act.submit(db.bills.filter(b=>b.status==='ready').map(b=>b.id))}>Submit ${count('ready')} ready</button></div>`}
    <div className="stack">
      <${Tabs} label="Bill status" value=${tab} onChange=${k=>setTab('bills',k)} items=${TAB_DEF.map(t=>[t[0],t[1],t[0]==='all'||t[0]==='paid'?undefined:count(t[0])])}/>
      <div className="toolbar" style=${{padding:'12px 0'}}>
        <label className="filter-inp"><${Icon} n="search" s=${14} cls="muted"/><input id="bill-search" aria-label="Filter bills" placeholder="Vendor, invoice or amount" value=${q} onInput=${e=>setQ(e.target.value)}/></label>
        <select className="sel sm" aria-label="Vendor" value=${vf} onChange=${e=>setVf(e.target.value)}><option value="">All vendors</option>${db.vendors.map(v=>html`<option key=${v.id} value=${v.id}>${v.name}</option>`)}</select>
        <div className="spacer"></div><span className="sub">${rows.length} ${rows.length===1?'bill':'bills'} · <${Money} n=${rows.reduce((s,b)=>s+b.amt,0)}/></span>
      </div>
      ${rows.length ? html`<div className="tbl-wrap"><table className="t">
        <thead><tr>
          ${canSelect && html`<th className="chk"><input type="checkbox" aria-label="Select all" checked=${!!allSel} onChange=${e=>{ const o={}; if (e.target.checked) rows.forEach(r=>o[r.id]=true); setSel(o); }}/></th>`}
          <th>Vendor</th><th className="hide-sm">Invoice</th><th>${tab==='scheduled'?'Pays on':tab==='paid'?'Paid on':'Due'}</th><th className="r">Amount</th><th className="hide-md">GL account</th><th>${lastCol}</th>
        </tr></thead>
        <tbody>${rows.map(b=>{ const v=vendorOf(db,b); const sug=b.lines.some(l=>l.sug); const od=isOverdue(b);
          return html`<tr key=${b.id} className=${cx('click',sel[b.id]&&'sel')} onClick=${()=>openBill(b.id)}>
            ${canSelect && html`<td className="chk" onClick=${e=>e.stopPropagation()}><input type="checkbox" aria-label=${'Select '+b.num} checked=${!!sel[b.id]} onChange=${e=>setSel(s=>({...s,[b.id]:e.target.checked}))}/></td>`}
            <td><div className="vcell"><${VLogo} v=${v}/><div className="stack" style=${{minWidth:0}}><span className="nm">${v.name}</span><span className="sub">${b.src}${b.rcv?' · '+b.rcv:''}</span></div></div></td>
            <td className="hide-sm mono">${b.num}</td>
            <td className="num" style=${od?{color:'var(--red)'}:null}>${fmtD(tab==='scheduled'?b.payOn:tab==='paid'?b.paidOn:b.due)}${od?html`<div className="sub" style=${{color:'var(--red)'}}>Overdue</div>`:null}</td>
            <td className="r num" style=${{fontWeight:500}}><${Money} n=${b.amt}/>${b.fx?html`<div className="sub">€${b.fx.amt.toLocaleString('en-US',{minimumFractionDigits:2})}</div>`:null}</td>
            <td className="hide-md"><span className="row" style=${{gap:6}}>${b.status!=='paid'?html`<span className="ai-mark" title="Coded by Autopilot"><${Spark} s=${11}/></span>`:null}<span>${glName(b.lines[0].gl)}</span>${b.lines.length>1?html`<span className="sub">+${b.lines.length-1}</span>`:null}</span></td>
            <td>${tab==='review' ? html`<div className="row" style=${{flexWrap:'wrap',gap:6}}>${b.flags.map((f,i)=>html`<span key=${i}>${flagPill(f)}</span>`)}${!b.flags.length&&sug?html`<span className="pill blue">1 suggestion to accept</span>`:null}</div>` : statusPill(b)}</td>
          </tr>`; })}</tbody></table></div>`
        : html`<div className="tbl-wrap"><${Empty} title=${tab==='review'?'Nothing needs review':'No bills here'} text=${ql||vf?'Try a different filter.':tab==='review'?'Autopilot will flag anything it isn’t sure about.':'Bills move here as they progress.'}/></div>`}
      ${selIds.length>0 && html`<div className="bulk" style=${{marginTop:16}}><span className="num">${selIds.length} selected · <${Money} n=${sumSel}/></span>${bulk()}<button className="btn sm" onClick=${()=>setSel({})}>Clear</button></div>`}
    </div>
  </div>`;
}

function BillDrawer({ctx, id, close}){
  const {db,act,setModal,nav} = ctx; const b = db.bills.find(x=>x.id===id); const [tab,setTab] = useState('details');
  const [rejecting,setRejecting] = useState(false); const [reason,setReason] = useState('');
  if (!b) return null;
  const v = vendorOf(db,b); const flags = b.flags; const po = b.po && db.pos.find(p=>p.id===b.po);
  const acts = db.activity.filter(a=>a.billId===b.id);
  const total = b.lines.reduce((s,l)=>s+l.a,0); const adds = Math.abs(total-b.amt)<0.005;
  const dupPaid = db.bills.find(x=>x.id!==b.id && x.v===b.v && x.num===b.num && x.status==='paid');
  const budgetUsed = 296400;
  const fields = [
    ['Invoice number', html`<span className="mono">${b.num}</span>`, 'h'],
    ['Invoice date', fmtDY(b.issued), 'h'],
    ['Due date', fmtDY(b.due), flags.some(f=>f.type==='date')?'l':'h'],
    ['Payment terms', v.terms, 'h'],
    ['Purchase order', po ? `${po.id} · ${po.status==='received'?'received':'open'}` : 'None', po?'m':(flags.some(f=>f.type==='po')?'l':'m')],
    ['Pay to', v.pendingBank && flags.some(f=>f.type==='bank') ? `${v.pendingBank.name} ··${v.pendingBank.last4} (new)` : `${v.bank.name} ··${v.bank.last4}`, flags.some(f=>f.type==='bank')?'l':'h'],
  ];
  const footer = () => {
    if (['review','hold','ready'].includes(b.status)) return html`<button className="btn ghost" onClick=${()=>ctx.toast('Thanks. Autopilot will review this reading.')}><${Icon} n="flag" s=${14}/>Report a reading error</button><span className="spacer"></span>${flags.length?html`<span className="sub">${flags.length} ${flags.length===1?'question':'questions'} left</span>`:null}<button className="btn pri" disabled=${flags.length>0} onClick=${()=>{act.submit(b.id); close();}}>Submit for approval</button>`;
    if (b.status==='approval' && b.approver===ME) return rejecting
      ? html`<input className="inp" id="reject-reason" style=${{flex:'1 1 240px'}} placeholder="What should AP fix?" value=${reason} onInput=${e=>setReason(e.target.value)}/><button className="btn" onClick=${()=>setRejecting(false)}>Cancel</button><button className="btn pri" disabled=${!reason.trim()} onClick=${()=>{act.reject(b.id,reason.trim()); close();}}>Return to AP</button>`
      : html`<span className="sub">Routed to you: bills of $25,000 or more</span><span className="spacer"></span><button className="btn" onClick=${()=>setRejecting(true)}>Reject</button><button className="btn pri" onClick=${()=>{act.approve(b.id); close();}}>Approve</button>`;
    if (b.status==='approval') return html`<span className="sub">Waiting on ${b.approver}</span><span className="spacer"></span><button className="btn" onClick=${()=>ctx.toast('Reminder sent to '+b.approver)}>Send reminder</button>`;
    if (b.status==='approved') return html`<span className="sub">Approved by ${b.approvedBy||'—'}</span><span className="spacer"></span><button className="btn pri" onClick=${()=>{close(); nav('payments',{tab:'run'});}}>Open payment run</button>`;
    if (b.status==='scheduled') return html`<span className="sub">${b.method} from Operating ··2502 on ${fmtD(b.payOn)}</span><span className="spacer"></span><button className="btn" onClick=${()=>{act.cancelPayment(b.id);}}>Cancel payment</button><button className="btn" onClick=${()=>act.settle(b.id)}>Mark as settled <span className="demo-tag">Demo</span></button>`;
    if (b.status==='paid') return html`<span className="sub">Paid ${fmtDY(b.paidOn)} by ${b.method||'ACH'} · reconciled</span>`;
    return html`<span className="sub">This bill is void.</span>`;
  };
  const flagCard = f => {
    if (f.type==='date') return html`<div className="flag-card" key="date"><div className="row"><${CF} l="l"/><b style=${{fontWeight:600}}>Confirm the due date</b><span className="sub">Low confidence</span></div><p>${f.text}</p><div className="row" style=${{flexWrap:'wrap'}}><button className="btn sm pri" onClick=${()=>act.resolve(b.id,'date',`Confirmed due date ${fmtD(f.suggest)}`,nb=>{nb.due=f.suggest;})}>Use ${fmtD(f.suggest)}</button><button className="btn sm" onClick=${()=>act.resolve(b.id,'date','Kept invoice-date due date')}>Keep ${fmtD(b.due)}</button><button className="btn sm ghost" onClick=${()=>ctx.setDrawer({type:'po',id:b.po})}>Open ${b.po}</button></div></div>`;
    if (f.type==='bank') return html`<div className="flag-card red" key="bank"><div className="row"><${Icon} n="shield" cls="bad"/><b style=${{fontWeight:600}}>Bank details changed</b></div><p>This invoice asks for payment to ${v.pendingBank?v.pendingBank.name+' ··'+v.pendingBank.last4:'a new account'} instead of the ${v.bank.name} account you verified. Autopilot held it before it could be scheduled.</p><div className="row"><button className="btn sm pri" onClick=${()=>setModal({type:'fraud',id:b.id})}>Review the change</button></div></div>`;
    if (f.type==='dup') return html`<div className="flag-card red" key="dup"><div className="row"><${Icon} n="copy" cls="bad"/><b style=${{fontWeight:600}}>Same as a bill you already paid</b></div><p>Vendor, invoice number and amount match ${dupPaid?`${dupPaid.num}, paid ${fmtDY(dupPaid.paidOn)}`:'a paid bill'}. Atlas sends a reminder copy when a payment is late, and this one arrived after the original was paid.</p><div className="row" style=${{flexWrap:'wrap'}}><button className="btn sm pri" onClick=${()=>act.voidBill(b.id)}>Void as duplicate</button><button className="btn sm" onClick=${()=>act.resolve(b.id,'dup','Marked as not a duplicate')}>It's not a duplicate</button>${dupPaid?html`<button className="btn sm ghost" onClick=${()=>ctx.setDrawer({type:'bill',id:dupPaid.id})}>Open paid bill</button>`:null}</div></div>`;
    if (f.type==='anomaly') return html`<div className="flag-card" key="anom"><div className="row"><${Icon} n="alert" cls="warnc"/><b style=${{fontWeight:600}}>Higher than usual</b></div><p>${f.text}</p><div className="row" style=${{flexWrap:'wrap'}}><button className="btn sm pri" onClick=${()=>act.resolve(b.id,'anomaly','Confirmed the higher amount')}>Amount is right</button><button className="btn sm" onClick=${()=>{ctx.toast('Draft sent to Harbor Legal asking for an itemized breakdown'); }}>Ask vendor for detail</button></div></div>`;
    if (f.type==='po') { const cand = db.pos.find(p=>p.id===f.poSuggest); return html`<div className="flag-card" key="po"><div className="row"><${Icon} n="po" cls="warnc"/><b style=${{fontWeight:600}}>No purchase order on the invoice</b></div><p>${cand?`${cand.id} is an open blanket PO for ${v.name} with ${money(cand.amt-0)} available. This bill fits within it.`:'No open PO found for this vendor.'}</p><div className="row" style=${{flexWrap:'wrap'}}>${cand?html`<button className="btn sm pri" onClick=${()=>act.resolve(b.id,'po',`Matched to ${cand.id}`,nb=>{nb.po=cand.id;})}>Match to ${cand.id}</button>`:null}<button className="btn sm" onClick=${()=>act.resolve(b.id,'po','Approved without a PO')}>Continue without a PO</button></div></div>`; }
    if (f.type==='tax') return html`<div className="flag-card" key="tax"><div className="row"><${CF} l="m"/><b style=${{fontWeight:600}}>Sales tax isn't on the invoice</b></div><p>Solder & Co. didn't charge sales tax. If these parts go into the robots you sell, the purchase is exempt for resale. Otherwise you owe California use tax at Fremont's 10.25% rate.</p><div className="row" style=${{flexWrap:'wrap'}}><button className="btn sm pri" onClick=${()=>act.resolve(b.id,'tax','Marked exempt: used in manufactured product')}>Exempt: goes into our product</button><button className="btn sm" onClick=${()=>act.resolve(b.id,'tax','Accrued CA use tax',nb=>{ const t=Math.round(nb.amt*0.1025*100)/100; nb.lines.push({d:'CA use tax accrual, 10.25%',a:t,gl:'6900',c:'h',sug:false,accrual:true}); })}>Accrue use tax</button></div></div>`;
    if (f.type==='split') return html`<div className="flag-card" key="split"><div className="row"><${CF} l="m"/><b style=${{fontWeight:600}}>Split across departments?</b></div><p>The trip receipts list 3 travelers: one each from Engineering, Operations and Sales. Last time, travel for this show was split evenly.</p><div className="row" style=${{flexWrap:'wrap'}}><button className="btn sm pri" onClick=${()=>act.resolve(b.id,'split','Split travel across 3 departments',nb=>{ const a=nb.amt; const p=Math.round(a/3*100)/100; nb.lines=[{d:'Travel, Engineering',a:p,gl:'6710',c:'h'},{d:'Travel, Operations',a:p,gl:'6710',c:'h'},{d:'Travel, Sales',a:Math.round((a-2*p)*100)/100,gl:'6710',c:'h'}]; })}>Split evenly across 3</button><button className="btn sm" onClick=${()=>act.resolve(b.id,'split','Kept travel in Operations')}>Keep in Operations</button></div></div>`;
    if (f.type==='rejected') return html`<div className="flag-card" key="rej"><div className="row"><${Icon} n="msg" cls="warnc"/><b style=${{fontWeight:600}}>Returned by the approver</b></div><p>"${f.reason}"</p><div className="row"><button className="btn sm pri" onClick=${()=>act.resolve(b.id,'rejected','Addressed approver note')}>Mark as fixed</button></div></div>`;
  };
  const head = html`<div className="row" style=${{alignItems:'flex-start',gap:12}}>
      <${VLogo} v=${v} size="lg"/>
      <div className="stack" style=${{flex:1,minWidth:0,gap:3}}>
        <div className="row" style=${{flexWrap:'wrap'}}><button className="btn ghost" style=${{height:'auto',padding:0,fontSize:17,fontWeight:600}} onClick=${()=>ctx.setDrawer({type:'vendor',id:v.id})}>${v.name}</button>${statusPill(b)}</div>
        <span className="sub"><span className="mono">${b.num}</span> · ${b.src==='Email'?'Read from email':b.src==='Portal'?'From vendor portal':'Uploaded'}${b.rcv?' at '+b.rcv:''}</span>
      </div>
      <div className="stack" style=${{alignItems:'flex-end'}}><span className="sub">Amount</span><span style=${{fontSize:24,fontWeight:600,letterSpacing:'-.01em'}}><${Money} n=${b.amt}/></span></div>
      <${CloseBtn} close=${close}/>
    </div>
    <${Tabs} label="Bill sections" value=${tab} onChange=${setTab} items=${[['details','Details'],['invoice','Invoice'],['activity','Activity',acts.length]]}/>`;
  return html`<${Drawer} close=${close} head=${head} foot=${footer()} label=${'Bill '+b.num}>

function ApprovalCard({ctx, b}){
  const {db,act,openBill} = ctx; const v = vendorOf(db,b); const risk = riskOf(db,b);
  const hist = db.bills.filter(x=>x.v===b.v && x.status==='paid').slice(-5).map(x=>x.amt);
  const series = hist.length ? [...hist, b.amt] : [b.amt*0.96,b.amt*0.98,b.amt*0.97,b.amt];
  const max = Math.max(...series)*1.1;
  const avg = hist.length ? hist.reduce((s,x)=>s+x,0)/hist.length : 0;
  const delta = avg ? Math.round((b.amt/avg-1)*100) : null;
  const po = b.po && db.pos.find(p=>p.id===b.po);
  const [confirm,setConfirm] = useState(false); const [reason,setReason] = useState('');
  return html`<article className="ap">
    <div className="row"><${VLogo} v=${v}/><div className="stack" style=${{flex:1,minWidth:0}}><span style=${{fontWeight:600}}>${v.name}</span><span className="sub"><span className="mono">${b.num}</span> · due ${fmtD(b.due)}</span></div><span className=${'pill '+(risk==='low'?'green':risk==='medium'?'amber':'red')}>${risk[0].toUpperCase()+risk.slice(1)} risk</span></div>
    <div className="row" style=${{alignItems:'baseline'}}><span style=${{fontSize:26,fontWeight:600,letterSpacing:'-.02em'}}><${Money} n=${b.amt}/></span><span className="sub">from ${b.submittedBy||'Priya Shah'}</span></div>
    <div className="stack" style=${{gap:8,padding:12,border:'1px solid var(--line)',borderRadius:10}}>
      <span className="ai-mark"><${Spark}/>Brief</span>
      <p style=${{lineHeight:1.55}}>${b.lines[0].d}${po?`, against ${po.id}. Goods were received ${fmtD(po.received)}.`:'.'} ${delta!==null?(delta>=0?`${delta}% above`:`${-delta}% below`)+` ${v.name.split(' ')[0]}'s recent average.`:'First large bill from this vendor.'} ${/^2\/10/.test(v.terms)?`Paying by ${fmtD(addDays(b.issued,10))} earns a 2% discount (${money(b.amt*0.02)}).`:''}</p>
      <div className="bars6" role="img" aria-label="Recent bills from this vendor compared with this one">${series.map((x,i)=>html`<i key=${i} className=${i===series.length-1?'cur':''} style=${{height:(x/max*100)+'%'}}></i>`)}</div>
    </div>
    <div className="stack" style=${{gap:6}}>
      <div className="chk-row"><${Icon} n="check" s=${15} w=${2.2} cls="ok"/>${po?`Matches ${po.id} and the goods receipt`:'No PO needed for this category'}</div>
      <div className="chk-row"><${Icon} n="check" s=${15} w=${2.2} cls="ok"/>Paying verified ${v.bank.name} ··${v.bank.last4}</div>
    </div>
    ${confirm ? html`<div className="stack" style=${{gap:8}}><label className="lbl-f" htmlFor=${'rr-'+b.id} style=${{margin:0}}>Note for AP</label><input id=${'rr-'+b.id} className="inp" value=${reason} onInput=${e=>setReason(e.target.value)} placeholder="What should be fixed?"/><div className="row"><span className="spacer"></span><button className="btn sm" onClick=${()=>setConfirm(false)}>Cancel</button><button className="btn sm pri" disabled=${!reason.trim()} onClick=${()=>act.reject(b.id,reason.trim())}>Return to AP</button></div></div>`
      : html`<div className="row" style=${{marginTop:'auto'}}><button className="btn sm ghost" onClick=${()=>openBill(b.id)}>Open bill</button><span className="spacer"></span><button className="btn" onClick=${()=>setConfirm(true)}>Reject</button><button className="btn pri" onClick=${()=>act.approve(b.id)}>Approve</button></div>`}
  </article>`;
}

function VendorDrawer({ctx, id, close}){

  const bs = billsFor(db,v.id).sort((a,b)=>a.issued<b.issued?1:-1);
  const unpaid = bs.filter(b=>['review','hold','ready','approval','approved'].includes(b.status)).reduce((s,b)=>s+b.amt,0);
  const sched = bs.filter(b=>b.status==='scheduled').reduce((s,b)=>s+b.amt,0);
  const paid = bs.filter(b=>b.status==='paid').reduce((s,b)=>s+b.amt,0);
  const head = html`<div className="row" style=${{gap:12}}><${VLogo} v=${v} size="lg"/><div className="stack" style=${{flex:1,minWidth:0}}><span style=${{fontSize:17,fontWeight:600}}>${v.name}</span><span className="sub">${v.cat} · owner ${v.owner}</span></div><${CloseBtn} close=${close}/></div>
    <${Tabs} label="Vendor sections" value=${tab} onChange=${setTab} items=${[['bills','Bills',bs.length],['details','Details'],['autopilot','Autopilot']]}/>`;
  return html`<${Drawer} close=${close} head=${head} label=${v.name}>
    <div className="stats" style=${{gridTemplateColumns:'repeat(3,minmax(0,1fr))'}}>
      <div className="stat"><span className="sub">Unpaid</span><span className="v"><${Money} n=${unpaid}/></span></div>
      <div className="stat"><span className="sub">Scheduled</span><span className="v"><${Money} n=${sched}/></span></div>
      <div className="stat"><span className="sub">Paid, 90 days</span><span className="v"><${Money} n=${paid}/></span></div>
    </div>
    ${v.pendingBank && html`<div className="flag-card red"><div className="row"><${Icon} n="shield" cls="bad"/><b style=${{fontWeight:600}}>Bank change requested</b></div><p>An invoice asked to pay ${v.pendingBank.name} ··${v.pendingBank.last4}. Payments stay on the verified account until someone confirms by phone.</p><div className="row"><button className="btn sm pri" onClick=${()=>{ const b=bs.find(x=>x.flags.some(f=>f.type==='bank')); if (b) ctx.setModal({type:'fraud',id:b.id}); }}>Review the change</button></div></div>`}
    ${tab==='bills' && html`<div className="tbl-wrap"><table className="t" style=${{minWidth:0}}><thead><tr><th>Invoice</th><th>Date</th><th className="r">Amount</th><th>Status</th></tr></thead><tbody>${bs.map(b=>html`<tr key=${b.id} className="click" onClick=${()=>openBill(b.id)}><td className="mono">${b.num}</td><td className="num">${fmtD(b.issued)}</td><td className="r num"><${Money} n=${b.amt}/></td><td>${statusPill(b)}</td></tr>`)}</tbody></table></div>`}
    ${tab==='details' && html`<div className="fgrid">
      <div className="card card-b stack" style=${{gap:2,paddingTop:14}}><span className="sec-t" style=${{marginBottom:6}}>Payment</span><div className="kv"><span>Bank</span><span>${v.bank.name}</span></div><div className="kv"><span>Account</span><span className="mono">··${v.bank.last4}</span></div><div className="kv"><span>Verified</span><span>${fmtDY(v.bank.verified)}</span></div><div className="kv"><span>Terms</span><span>${v.terms}</span></div></div>
      <div className="card card-b stack" style=${{gap:2,paddingTop:14}}><span className="sec-t" style=${{marginBottom:6}}>Contact</span><div className="kv"><span>Email</span><span style=${{wordBreak:'break-all',textAlign:'right'}}>${v.email}</span></div><div className="kv"><span>Phone on file</span><span className="mono">${v.phone}</span></div><div className="kv"><span>Currency</span><span>${v.cur||'USD'}</span></div></div>
      <div className="card card-b stack" style=${{gap:2,paddingTop:14}}><span className="sec-t" style=${{marginBottom:6}}>Accounting defaults</span><div className="kv"><span>GL account</span><span>${glName(v.gl)}</span></div><div className="kv"><span>Budget owner</span><span>${v.owner}</span></div><div className="kv"><span>1099</span><span>${['hl','bs'].includes(v.id)?'Yes':'No'}</span></div></div>
    </div>`}
    ${tab==='autopilot' && html`<div className="stack" style=${{gap:14}}>
      <p className="muted" style=${{lineHeight:1.5}}>Choose how much Ledgerline does on its own for ${v.name}. Bank changes and new payees always need a person.</p>
      <${Seg} label="Autopilot level" value=${v.level} onChange=${l=>act.setVendorLevel(v.id,l)} items=${[['suggest','Suggest'],['copilot','Co-pilot'],['autopilot','Autopilot']]}/>
      <div className="card card-b stack" style=${{gap:2,paddingTop:14}}><div className="kv"><span>Bills read, 90 days</span><span className="num">${Math.max(3,bs.length*6)}</span></div><div className="kv"><span>Fields corrected</span><span className="num">${v.id==='nw'?0:1}</span></div><div className="kv"><span>Usual GL</span><span>${glName(v.gl)}</span></div></div>
    </div>`}
  <//>`;

/* ---------- Purchase orders ---------- */
function POPage({ctx}){
  const {db,tabs,setTab,setDrawer} = ctx; const tab = tabs.pos;
  const billed = p => db.bills.filter(b=>b.po===p.id && b.status!=='void').reduce((s,b)=>s+b.amt,0);
  const f = {open:p=>p.status!=='closed', closed:p=>p.status==='closed', all:()=>true}[tab];
  const rows = db.pos.filter(f);
  const stLabel = {open:['Open','blue'],received:['Received','green'],partial:['Partly billed','amber'],closed:['Closed','gray']};
  return html`<div className="page">
    <div className="ph"><div><h1>Purchase orders</h1><div className="desc">Bills are matched to POs and goods receipts automatically.</div></div><div className="spacer"></div><button className="btn pri" onClick=${()=>ctx.toast('PO creation is not part of this demo')}><${Icon} n="plus" s=${15}/>New PO</button></div>
    <${Tabs} label="PO status" value=${tab} onChange=${k=>setTab('pos',k)} items=${[['open','Open',db.pos.filter(p=>p.status!=='closed').length],['closed','Closed'],['all','All']]}/>
    <div className="tbl-wrap"><table className="t"><thead><tr><th>PO</th><th>Vendor</th><th className="hide-md">Owner</th><th>Billed</th><th className="r">Amount</th><th>Status</th></tr></thead>
      <tbody>${rows.map(p=>{ const v=db.vendors.find(x=>x.id===p.v); const bl=Math.min(billed(p),p.amt); const pct=bl/p.amt*100; const st=stLabel[p.status]; return html`<tr key=${p.id} className="click" onClick=${()=>setDrawer({type:'po',id:p.id})}>
        <td className="mono">${p.id}</td><td><div className="vcell"><${VLogo} v=${v} size="sm"/>${v.name}</div></td><td className="hide-md">${p.owner}</td>
        <td style=${{minWidth:150}}><div className="stack" style=${{gap:5}}><div className="meter"><i style=${{width:pct+'%'}}></i></div><span className="sub num">${money(bl,0)} of ${money(p.amt,0)}</span></div></td>
        <td className="r num"><${Money} n=${p.amt}/></td><td><span className=${'pill '+st[1]}>${st[0]}</span></td></tr>`; })}</tbody></table></div>
  </div>`;
}

/* ---------- Reconciliation ---------- */
function ReconPage({ctx}){
  const {db,tabs,setTab,act,openBill} = ctx; const tab = tabs.recon;
  const att = db.txns.filter(t=>t.status!=='matched'); const done = db.txns.filter(t=>t.status==='matched');
  const [gl,setGl] = useState({}); const [pick,setPick] = useState({});
  const unpaidCands = t => db.bills.filter(b=>['paid','scheduled'].includes(b.status) && Math.abs(b.amt-Math.abs(t.amt))<1);
  return html`<div className="page">
    <div className="ph"><div><h1>Reconciliation</h1><div className="desc">Operating ··2502 and company cards · October</div></div><div className="spacer"></div><span className="sub">${done.length} of ${db.txns.length} matched</span></div>
    <div className="stats"><div className="stat"><span className="sub">Matched by Autopilot</span><span className="v num">${57+done.filter(t=>t.by==='Autopilot').length}</span></div><div className="stat"><span className="sub">Need a person</span><span className="v num">${att.length}</span></div><div className="stat"><span className="sub">Days to close</span><span className="v num">4</span></div><div className="stat"><span className="sub">Close date</span><span className="v">${fmtD('2026-10-31')}</span></div></div>
    <${Tabs} label="Transactions" value=${tab} onChange=${k=>setTab('recon',k)} items=${[['attention','Needs attention',att.length],['matched','Matched',done.length]]}/>
    ${tab==='attention' && (att.length ? html`<div className="stack" style=${{gap:10}}>${att.map(t=>{ const m=t.match&&db.bills.find(b=>b.id===t.match); const v=m&&vendorOf(db,m); const cands=unpaidCands(t);
      return html`<div key=${t.id} className="card rc">
        <div className="stack" style=${{minWidth:0}}><span className="mono" style=${{fontSize:12.5}}>${t.desc}</span><span className="sub">${fmtDY(t.date)}</span><span className="num" style=${{fontWeight:600,color:t.amt>0?'var(--green)':'var(--ink)',marginTop:2}}>${t.amt>0?'+':''}${money(t.amt)}</span></div>
        <div className="stack" style=${{gap:6,minWidth:0}}>
          ${t.status==='suggested' && m ? html`<span className="ai-mark"><${Spark}/>Suggested match · ${t.conf}%</span><button className="btn ghost" style=${{height:'auto',padding:0,justifyContent:'flex-start'}} onClick=${()=>openBill(m.id)}><span className="vcell"><${VLogo} v=${v} size="sm"/><span>${v.name} · <span className="mono">${m.num}</span> · ${money(m.amt)}</span></span></button>`
          : html`<span className="sub" style=${{lineHeight:1.5}}>${t.hint}</span>`}
          ${t.status==='unmatched' && !t.deposit && !t.receipt && html`<div className="row" style=${{flexWrap:'wrap'}}><select className="sel sm" aria-label="GL account" value=${gl[t.id]||t.gl} onChange=${e=>setGl(g=>({...g,[t.id]:e.target.value}))}>${Object.keys(GL).map(c=>html`<option key=${c} value=${c}>${glName(c)}</option>`)}</select>${cands.length?html`<select className="sel sm" aria-label="Match to bill" value=${pick[t.id]||''} onChange=${e=>setPick(p=>({...p,[t.id]:e.target.value}))}><option value="">Or match to a bill…</option>${cands.map(b=>html`<option key=${b.id} value=${b.id}>${b.num}</option>`)}</select>`:null}</div>`}
          ${t.requested && html`<span className="pill amber" style=${{alignSelf:'flex-start'}}>Receipt requested</span>`}
        </div>
        <div className="row" style=${{justifyContent:'flex-end',flexWrap:'wrap'}}>
          ${t.status==='suggested' && html`<button className="btn sm" onClick=${()=>act.recon(t.id,'reject')}>Not this</button><button className="btn sm pri" onClick=${()=>act.recon(t.id,'accept')}>Accept match</button>`}
          ${t.status==='unmatched' && t.deposit && html`<button className="btn sm pri" onClick=${()=>act.recon(t.id,'deposit')}>Send to Receivables</button>`}
          ${t.status==='unmatched' && t.receipt && html`<button className="btn sm" disabled=${t.requested} onClick=${()=>act.recon(t.id,'receipt')}>Ask for receipt</button><button className="btn sm pri" onClick=${()=>act.recon(t.id,'expense',t.gl)}>Book to Travel</button>`}
          ${t.status==='unmatched' && !t.deposit && !t.receipt && html`${pick[t.id]?html`<button className="btn sm pri" onClick=${()=>act.recon(t.id,'link',pick[t.id])}>Match bill</button>`:html`<button className="btn sm pri" onClick=${()=>act.recon(t.id,'expense',gl[t.id]||t.gl)}>Book as expense</button>`}`}
        </div>
      </div>`; })}</div>` : html`<div className="card"><${Empty} title="Everything is reconciled" text="October is ready to close."/></div>`)}
    ${tab==='matched' && html`<div className="tbl-wrap"><table className="t"><thead><tr><th>Date</th><th>Bank description</th><th>Matched to</th><th className="hide-sm">By</th><th className="r">Amount</th></tr></thead><tbody>${done.sort((a,b)=>a.date<b.date?1:-1).map(t=>{ const m=t.match&&db.bills.find(b=>b.id===t.match); return html`<tr key=${t.id} className=${m?'click':''} onClick=${()=>m&&openBill(m.id)}><td className="num">${fmtD(t.date)}</td><td className="mono" style=${{fontSize:12.5}}>${t.desc}</td><td>${m?html`<span className="mono">${m.num}</span>`:html`<span>${t.booked}</span>`}</td><td className="hide-sm">${t.by==='Autopilot'?html`<span className="ai-mark"><${Spark}/>Autopilot</span>`:t.by}</td><td className="r num">${money(t.amt)}</td></tr>`; })}</tbody></table></div>`}
  </div>`;
}

/* ---------- Cash forecast ---------- */
function ForecastPage({ctx}){
  const {db,act} = ctx; const [days,setDays] = useState('30'); const [floorIn,setFloorIn] = useState(String(db.settings.floor));
  const n = Number(days); const fc = forecast(db,n); const floor = db.settings.floor; const below = fc.pts.find(p=>p.v<floor);
  const outs = fc.events.filter(e=>e.a<0).sort((a,b)=>a.d<b.d?-1:1);
  return html`<div className="page">
    <div className="ph"><div><h1>Cash forecast</h1><div className="desc">Operating ··2502, from scheduled payments, approved bills, payroll and expected receipts</div></div><div className="spacer"></div><${Seg} label="Horizon" value=${days} onChange=${setDays} items=${[['30','30 days'],['60','60 days'],['90','90 days']]}/></div>
    <div className="stats">
      <div className="stat"><span className="sub">Balance today</span><span className="v"><${Money} n=${START_BAL}/></span></div>
      <div className="stat"><span className="sub">Lowest point</span><span className="v num" style=${below?{color:'var(--red)'}:null}>${kfmt(fc.low.v)}</span><span className="sub">${fmtD(fc.low.d)}</span></div>
      <div className="stat"><span className="sub">In ${n} days</span><span className="v num">${kfmt(fc.endBal)}</span></div>
      <div className="stat"><span className="sub">Floor</span><span className="v num">${kfmt(floor)}</span></div>
    </div>
    ${below && html`<div className="flag-card red"><div className="row"><${Icon} n="alert" cls="bad"/><b style=${{fontWeight:600}}>Balance drops below your floor on ${fmtD(below.d)}</b></div><p>The dip comes from payroll on ${fmtD(below.d)} landing before the ${fmtD('2026-12-18')} customer milestone. Pay Planner will hold non-urgent bills that week unless you change the floor or move cash from savings.</p></div>`}
    <section className="card"><div className="card-h"><h3>Projected balance</h3><span className="spacer"></span><div className="legend"><span><i className="sw" style=${{background:'var(--accent)'}}></i>Balance</span><span><i className="sw" style=${{background:'var(--red-mark)'}}></i>Floor</span></div></div>
      <div className="card-b"><${LineChart} pts=${fc.pts} floor=${floor} h=${260} label=${`${n}-day cash forecast`}/></div></section>
    <div className="split">
      <section className="stack" style=${{gap:10,minWidth:0}}><h2 style=${{fontSize:16,fontWeight:600}}>Money going out</h2>
        <div className="tbl-wrap"><table className="t"><thead><tr><th>Date</th><th>What</th><th className="hide-sm">Type</th><th className="r">Amount</th></tr></thead><tbody>${outs.slice(0,14).map((e,i)=>html`<tr key=${i}><td className="num">${fmtD(e.d)}</td><td>${e.label}</td><td className="hide-sm"><span className=${'pill '+(e.kind==='expected'?'gray':e.kind==='payroll'?'blue':'gray')}>${{payroll:'Payroll',rent:'Rent',bill:'Scheduled bill',expected:'Expected bill'}[e.kind]}</span></td><td className="r num">${money(e.a)}</td></tr>`)}</tbody></table></div></section>
      <section className="card card-b stack" style=${{gap:10,paddingTop:16}}>
        <span style=${{fontWeight:600}}>Cash floor</span><span className="sub" style=${{lineHeight:1.5}}>Pay Planner won't schedule payments that take the balance below this amount.</span>
        <label className="lbl-f" htmlFor="floor" style=${{margin:0}}>Minimum balance (USD)</label>
        <div className="row"><input id="floor" className="inp num" inputMode="numeric" value=${floorIn} onInput=${e=>setFloorIn(e.target.value.replace(/[^0-9]/g,''))}/><button className="btn pri" disabled=${!floorIn||Number(floorIn)===floor} onClick=${()=>{act.setSetting('floor',Number(floorIn)); ctx.toast('Cash floor updated');}}>Save</button></div>
      </section>
    </div>
  </div>`;
}

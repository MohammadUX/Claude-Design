  items.push({icon:'recon',t:'57 bank transactions matched overnight',s:'Autopilot · 7:30 AM',go:()=>nav('recon')});
  return html`<div className="pop" role="dialog" aria-label="Notifications"><div className="row" style=${{padding:'12px 14px',borderBottom:'1px solid var(--line)'}}><b style=${{fontWeight:600}}>Notifications</b><span className="spacer"></span><button className="btn sm ghost" onClick=${close}>Close</button></div>
    ${items.map((it,i)=>html`<button key=${i} className="task" style=${{borderTop:i?'1px solid var(--line-2)':0}} onClick=${()=>{close(); it.go();}}><span className="ti" style=${it.tone==='red'?{background:'var(--red-bg)',color:'var(--red)'}:null}><${Icon} n=${it.icon}/></span><span className="stack" style=${{flex:1,minWidth:0}}><span style=${{fontWeight:500}}>${it.t}</span><span className="sub">${it.s}</span></span></button>`)}</div>`;
}

/* ---------- Command palette ---------- */
function Palette({ctx, close}){
  const {db,nav,openBill,setDrawer} = ctx; const [q,setQ] = useState(''); const [i,setI] = useState(0); const ref = useRef(null);
  useEffect(()=>{ ref.current && ref.current.focus(); },[]);
  const ql = q.trim().toLowerCase();
  const pages = NAV.filter(n=>n[0]!=='-').filter(n=>!ql||n[1].toLowerCase().includes(ql)).map(n=>({grp:'Pages',icon:n[2],label:n[1],go:()=>nav(n[0])}));
  const bills = db.bills.filter(b=>b.status!=='void').filter(b=>ql && (vendorOf(db,b).name+' '+b.num+' '+b.amt).toLowerCase().includes(ql)).slice(0,6).map(b=>({grp:'Bills',icon:'bills',label:`${vendorOf(db,b).name} · ${b.num}`,meta:money(b.amt),go:()=>openBill(b.id)}));
  const vends = db.vendors.filter(v=>ql && v.name.toLowerCase().includes(ql)).slice(0,5).map(v=>({grp:'Vendors',icon:'vendors',label:v.name,meta:v.cat,go:()=>setDrawer({type:'vendor',id:v.id})}));
  const actions = [{grp:'Actions',icon:'upload',label:'Upload a bill',go:()=>ctx.setModal({type:'upload'})},{grp:'Actions',icon:'payments',label:'Review the payment run',go:()=>nav('payments',{tab:'run'})}].filter(a=>!ql||a.label.toLowerCase().includes(ql));
  const all = [...bills,...vends,...pages,...actions];
  const run = it => { close(); it.go(); };
  let lastGrp = null;
  return html`<div><div className="scrim" style=${{zIndex:94}} onClick=${close}></div><div className="palette" role="dialog" aria-label="Search">
    <input ref=${ref} id="palette-q" aria-label="Search bills, vendors or pages" placeholder="Search bills, vendors or pages" value=${q} onInput=${e=>{setQ(e.target.value); setI(0);}} onKeyDown=${e=>{ if (e.key==='ArrowDown'){e.preventDefault(); setI(x=>Math.min(x+1,all.length-1));} else if (e.key==='ArrowUp'){e.preventDefault(); setI(x=>Math.max(x-1,0));} else if (e.key==='Enter' && all[i]) run(all[i]); }}/>
    <div className="pal-list" role="listbox">${all.map((it,k)=>{ const g = it.grp!==lastGrp; lastGrp = it.grp; return html`<div key=${k}>${g?html`<div className="pal-grp">${it.grp}</div>`:null}<button className="pal-item" role="option" aria-selected=${k===i} onMouseEnter=${()=>setI(k)} onClick=${()=>run(it)}><${Icon} n=${it.icon} cls="muted"/><span style=${{flex:1}}>${it.label}</span>${it.meta?html`<span className="sub num">${it.meta}</span>`:null}</button></div>`; })}
      ${!all.length && html`<div className="empty" style=${{padding:24}}>No results for "${q}"</div>`}</div>
  </div></div>`;
}

/* ---------- Ask Ledger ---------- */
function answerFor(q, db, ctx){
  if (q==='__cancel') return {body:html`<p>Okay. Nothing changed.</p>`};
  const s = q.toLowerCase();
  const cite = (label, go) => html`<button className="cite" onClick=${go}>${label}</button>`;
  if (/software|saas|subscription/.test(s)) return {body:html`<p>Software spend was <b style=${{fontWeight:600}}>$148,300</b> in Q3, up 18% from $125,700 in Q2. Two vendors explain most of the $22,600 increase:</p>
      <p>1. <b style=${{fontWeight:600}}>Atlas Cloud</b>, +$14,900. Usage grew with the new simulation cluster.${cite('6 bills',()=>ctx.setDrawer({type:'vendor',id:'ac'}))}</p>
      <p>2. <b style=${{fontWeight:600}}>Figment Design</b>, +$5,200. 12 seats were added in August.${cite('1 bill',()=>ctx.setDrawer({type:'vendor',id:'fd'}))}</p>
      ${db.renewalsHeld?html`<p>The 3 unused tools are already on hold.</p>`:html`<p>3 tools had no sign-ins for 60 days: Loomwise, Tabula Forms and Stackpad. They renew for <b style=${{fontWeight:600}}>$2,140 a month</b>.${cite('SSO log',()=>ctx.nav('spend'))}</p>`}`,
    src:'Based on 42 bills, 2 contracts and the SSO sign-in log.', chips: db.renewalsHeld?['What is due this week?']:['Hold the 3 unused renewals','What is due this week?']};
  if (/hold.*renewal|unused/.test(s)) return db.renewalsHeld ? {body:html`<p>Those renewals are already on hold.</p>`} : {body:html`<p>Here's the plan. Nothing changes until you confirm.</p>`, plan:true};
  if (/due|this week|next week|upcoming/.test(s)){ const end=addDays(TODAY,7); const list=db.bills.filter(b=>isOpen(b)&&b.status!=='scheduled'&&b.due>=TODAY&&b.due<=end).sort((a,b)=>a.due<b.due?-1:1);
    return {body:html`<p>${list.length} unpaid bills are due by ${fmtD(end)}, ${money(list.reduce((x,b)=>x+b.amt,0))} in total:</p>${list.map(b=>html`<p key=${b.id}>${fmtD(b.due)} · ${vendorOf(db,b).name}, ${money(b.amt)} ${cite(b.num,()=>ctx.openBill(b.id))}</p>`)}<p className="muted">${db.bills.filter(b=>b.status==='scheduled').length} more are already scheduled.</p>`, src:'From open bills in Ledgerline.', chips:['What needs my review?','How is cash looking?']}; }
  if (/overdue|late/.test(s)){ const list=db.bills.filter(isOverdue); return {body: list.length?html`<p>${list.length} bills are past due:</p>${list.map(b=>html`<p key=${b.id}>${vendorOf(db,b).name}, ${money(b.amt)}, due ${fmtD(b.due)} ${cite(b.num,()=>ctx.openBill(b.id))}</p>`)}<p className="muted">Atlas AC-88213 is on hold as a likely duplicate, so it may not be owed at all.</p>`:html`<p>Nothing is overdue.</p>`, chips:['What is due this week?']}; }
  if (/cash|runway|balance|forecast/.test(s)){ const fc=forecast(db,30); return {body:html`<p>Operating ··2502 has <b style=${{fontWeight:600}}>${money(START_BAL,0)}</b> today. Over the next 30 days the balance bottoms out at <b style=${{fontWeight:600}}>${kfmt(fc.low.v)}</b> on ${fmtD(fc.low.d)}, ${fc.low.v>=db.settings.floor?'which stays above':'which is below'} your ${kfmt(db.settings.floor)} floor.${cite('Forecast',()=>ctx.nav('forecast'))}</p>`, src:'From scheduled and approved bills, payroll and expected receipts.', chips:['What is due this week?']}; }
  if (/review|need|attention|todo|to do/.test(s)){ const list=db.bills.filter(b=>b.status==='review'||b.status==='hold'); return {body:html`<p>${list.length} bills need you:</p>${list.map(b=>html`<p key=${b.id}>${vendorOf(db,b).name}: ${b.flags.map(f=>FLAG[f.type].label.toLowerCase()).join(', ')||'suggestion to accept'} ${cite(b.num,()=>ctx.openBill(b.id))}</p>`)}`, chips:['What is due this week?']}; }
  const v = db.vendors.find(x=>s.includes(x.name.toLowerCase().split(' ')[0]));
  if (v){ const bs=billsFor(db,v.id); const paid=bs.filter(b=>b.status==='paid'); return {body:html`<p><b style=${{fontWeight:600}}>${v.name}</b> has ${bs.filter(isOpen).length} open bills worth ${money(bs.filter(isOpen).reduce((x,b)=>x+b.amt,0))}. You paid ${paid.length} bills in the last 90 days. Terms are ${v.terms}, and they're on ${v.level}.${cite('Vendor',()=>ctx.setDrawer({type:'vendor',id:v.id}))}</p>`}; }
  return {body:html`<p>I can answer questions about your bills, vendors, payments and spend, and point you to the source. Try one of these.</p>`, chips:['What needs my review?','What is due this week?','How is cash looking?','Why is software spend up this quarter?']};
}
function AskPanel({ctx, seedQ, close}){
  const {db,act} = ctx; const [msgs,setMsgs] = useState([]); const [q,setQ] = useState(''); const endRef = useRef(null);
  const ask = text => { if (!text.trim()) return; setMsgs(m=>[...m,{role:'u',text},{role:'a',q:text}]); setQ(''); };
  useEffect(()=>{ if (seedQ) ask(seedQ); },[]);
  useEffect(()=>{ endRef.current && endRef.current.scrollIntoView({block:'end'}); },[msgs]);
  const starters = ['What needs my review?','What is due this week?','How is cash looking?','Why is software spend up this quarter?'];
  return html`<aside className="ask" aria-label="Ask Ledger">
    <div className="row" style=${{height:56,padding:'0 12px 0 16px',borderBottom:'1px solid var(--line)',flex:'none'}}><span className="ai-mark" style=${{fontSize:14,color:'var(--ink)'}}><${Spark} s=${14}/>Ask Ledger</span><span className="spacer"></span><${CloseBtn} close=${close}/></div>
    <div className="ask-body">
      ${!msgs.length && html`<div className="stack" style=${{gap:10}}><p className="muted" style=${{lineHeight:1.5}}>Ask about bills, vendors, payments or spend. Answers link to their sources, and nothing changes without your confirmation.</p><div className="row" style=${{flexWrap:'wrap',gap:6}}>${starters.map(s=>html`<button key=${s} className="chip" onClick=${()=>ask(s)}>${s}</button>`)}</div></div>`}
      ${msgs.map((m,i)=> m.role==='u' ? html`<div key=${i} className="bubble">${m.text}</div>` : (()=>{ const a = answerFor(m.q, db, ctx); return html`<div key=${i} className="answer">${a.body}
        ${a.src && html`<span className="sub">${a.src}</span>`}
        ${a.plan && !db.renewalsHeld && html`<div className="plan"><div className="row" style=${{padding:'10px 12px',background:'var(--sunk)',borderBottom:'1px solid var(--line-2)'}}><b style=${{fontWeight:600}}>Plan: hold 3 renewals</b><span className="sub">saves $2,140 a month</span></div>
          ${[['Loomwise · Design','Nov 3','$980/mo'],['Tabula Forms · Operations','Nov 9','$640/mo'],['Stackpad · Operations','Nov 15','$520/mo']].map(r=>html`<div key=${r[0]} className="pr"><span>${r[0]}</span><span className="sub">Renews ${r[1]}</span><span className="num">${r[2]}</span></div>`)}
          <div style=${{padding:'10px 12px',fontSize:12.5,lineHeight:1.5,color:'var(--ink-2)'}}>Tool owners Jamie Park and Luis Ortega will get a note. You can undo any hold before its renewal date.</div>
          <div className="row" style=${{padding:'0 12px 12px',justifyContent:'flex-end'}}><button className="btn sm" onClick=${()=>setMsgs(x=>[...x,{role:'a',q:'__cancel'}])}>Cancel</button><button className="btn sm pri" onClick=${act.holdRenewals}>Hold 3 renewals</button></div></div>`}
        ${a.plan && db.renewalsHeld && html`<span className="pill green" style=${{alignSelf:'flex-start'}}>Done: 3 renewals held</span>`}
        ${a.chips && i===msgs.length-1 && html`<div className="row" style=${{flexWrap:'wrap',gap:6}}>${a.chips.map(c=>html`<button key=${c} className="chip" onClick=${()=>ask(c)}>${c}</button>`)}</div>`}
      </div>`; })())}
      <div ref=${endRef}></div>
    </div>
    <form style=${{flex:'none',padding:'12px 16px 16px',borderTop:'1px solid var(--line)'}} onSubmit=${e=>{e.preventDefault(); ask(q);}}>
      <label className="row" style=${{height:44,border:'1px solid var(--line-strong)',borderRadius:10,padding:'0 6px 0 12px'}}><input id="ask-q" aria-label="Ask Ledger a question" placeholder="Ask about bills, vendors or spend" value=${q} onInput=${e=>setQ(e.target.value)} style=${{flex:1,border:0,outline:'none',background:'transparent',minWidth:0}}/><button className="btn pri icon-btn sm" type="submit" aria-label="Send" disabled=${!q.trim()}><${Icon} n="send" s=${15} w=${2}/></button></label>
    </form>
  </aside>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
